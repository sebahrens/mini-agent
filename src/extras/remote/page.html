<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mini-agent remote</title>
<style>body{font:15px system-ui,sans-serif;margin:0;display:flex;flex-direction:column;height:100vh}
#log{flex:1;overflow:auto;padding:8px;white-space:pre-wrap;font-family:ui-monospace,monospace}
.ask{background:#fff3cd;padding:8px;margin:6px 0}form{display:flex;gap:6px;padding:8px;border-top:1px solid #8884}
input{flex:1;font:inherit;padding:6px}button{font:inherit;padding:6px 10px}</style></head>
<body><div id="log" role="log" aria-live="polite"></div>
<form id="f"><input id="t" aria-label="Steer the running turn" placeholder="steer the running turn"><button>Send</button><button type="button" id="c">Cancel</button></form>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
const h={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
const log=document.getElementById('log');
function add(el){log.appendChild(el);log.scrollTop=log.scrollHeight}
function line(t){const d=document.createElement('div');d.textContent=t;add(d)}
const post=(p,b)=>fetch(p,{method:'POST',headers:h,body:JSON.stringify(b)});
fetch('/events',{headers:h}).then(async r=>{
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf('\n\n'))>=0){const m=buf.slice(0,i);buf=buf.slice(i+2);
      const d=m.split('\n').find(l=>l.startsWith('data: '));if(!d)continue;
      const e=JSON.parse(d.slice(6));
      if(e.type==='permission'){const box=document.createElement('div');box.className='ask';box.dataset.id=e.id;
        box.append('Permission needed: '+e.summary+' ');
        for(const [label,allow] of [['Allow',true],['Deny',false]]){const b=document.createElement('button');b.textContent=label;
          b.onclick=()=>{post('/permission',{id:e.id,allow});box.remove()};box.append(b)}
        add(box)}
      else if(e.type==='permission_closed'){document.querySelectorAll('.ask').forEach(b=>{if(b.dataset.id===e.id)b.remove()})}
      else if(e.type==='text')line(e.text);
      else line('['+e.type+'] '+(e.summary||e.name||''))}}
});
document.getElementById('f').onsubmit=ev=>{ev.preventDefault();const t=document.getElementById('t');if(t.value){post('/steer',{text:t.value});line('> '+t.value);t.value=''}};
document.getElementById('c').onclick=()=>post('/cancel',{});
</script></body></html>

[workspace]
members = [".", "spike"]
resolver = "2"

[workspace.metadata.dependency-policy]
cargo-audit-version = "0.22.1"
cargo-deny-version = "0.19.4"
max-exception-days = 90

[package]
name = "mini-agent"
version = "1.7.2"
edition = "2024"
description = "Minimalistic coding agent with built-in JS engine"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["ai", "cli", "dev"]

[package.metadata.release]
canonical-binary = "mini-agent"

[features]
default = ['loop', 'git-worktree', 'mcp', 'subagents', 'archmd', 'status-signals', 'multithread', 'export', 'js']
status-signals = []
loop = []
export = []
git-worktree = []
mcp = [
    "dep:rmcp",
    "rmcp?/client",
    "rmcp?/transport-child-process",
    "rmcp?/transport-streamable-http-client-reqwest",
    "rmcp?/auth",
    "rmcp?/which-command",
]
acp = ["dep:agent-client-protocol", "dep:blocking"]
memory = []
subagents = []
archmd = []
multithread = ["tokio/rt-multi-thread"]
multimodal = ["rig/image"]
pdf = ["multimodal", "rig/pdf"]
advisor = []
hooks = []
lsp = ["dep:lsp-types"]
js = ["dep:rquickjs"]

[dependencies]
rig = { package = "rig-core", version = "0.40", default-features = false, features = [
    "reqwest",
    "derive",
    "native-tls",
] }
rmcp = { version = "2.0", optional = true, default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1.1"
tokio = { version = "1", features = [
    "rt",
    "macros",
    "sync",
    "time",
    "process",
    "fs",
] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
    "charset",
    "http2",
    "system-proxy",
] }
dirs = "6"
sha2 = "0.10"
unicase = "2"
unicode-normalization = "0.1"
compact_str = { version = "0.10", features = ["serde"] }
smallvec = "1"
regex = "1"
unicode-width = "0.2"
ignore = "0.4"
pulldown-cmark = "0.13"
include_dir = "0.7"
http = "1"
agent-client-protocol = { version = "1.0.1", optional = true }
blocking = { version = "1", optional = true }
lsp-types = { version = "0.97", optional = true }
rquickjs = { version = "0.12", features = ["full"], optional = true }

[dev-dependencies]
rig = { package = "rig-core", version = "0.40", features = ["test-utils"] }

[profile.dev]
opt-level = 0
debug = false
codegen-units = 16
incremental = true

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
debug = false

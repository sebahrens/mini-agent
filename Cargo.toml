[workspace]
members = ["."]
exclude = ["spike"]
resolver = "2"

[workspace.metadata.dependency-policy]
cargo-audit-version = "0.22.1"
cargo-deny-version = "0.19.4"
max-exception-days = 90

[package]
name = "mini-agent"
version = "1.7.2"
edition = "2024"
description = "Minimalistic coding agent with built-in JS engine"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/sebahrens/mini-agent"
homepage = "https://github.com/sebahrens/mini-agent"
keywords = ["ai", "cli", "dev"]

[package.metadata.release]
canonical-binary = "mini-agent"

[features]
default = ['loop', 'git-worktree', 'mcp', 'subagents', 'archmd', 'status-signals', 'multithread', 'export', 'js', 'sandbox', 'memory']
status-signals = []
loop = []
export = []
git-worktree = []
mcp = [
    "dep:rmcp",
    "dep:process-wrap",
    "rmcp?/client",
    "rmcp?/transport-child-process",
    "rmcp?/transport-streamable-http-client-reqwest",
    "rmcp?/auth",
    "rmcp?/which-command",
]
acp = ["dep:agent-client-protocol", "dep:blocking"]
memory = []
subagents = []
archmd = []
multithread = ["tokio/rt-multi-thread"]
multimodal = ["rig/image"]
pdf = ["multimodal", "rig/pdf"]
advisor = []
hooks = []
lsp = ["dep:lsp-types", "dep:process-wrap", "dep:which"]
js = ["dep:rquickjs"]
sandbox = []
skills = ["js", "dep:rusqlite", "dep:matrixmultiply", "dep:hnsw_rs"]
# Real ONNX/BGE embedding backend. Opt-in because `ort-sys` ships no prebuilt
# binaries for some hosts (notably x86_64-apple-darwin); `skills` alone must build
# everywhere and uses the deterministic backend.
skills-embed = ["skills", "dep:fastembed", "dep:ort"]
# Link ONNX Runtime at runtime instead of requiring a build-time prebuilt binary.
# Needed on hosts ort-sys has no prebuilt for (notably x86_64-apple-darwin);
# requires ORT_DYLIB_PATH to point at a local libonnxruntime at run time.
skills-embed-dynamic = ["skills-embed", "ort/load-dynamic"]

[dependencies]
rig = { package = "rig-core", version = "0.40", default-features = false, features = [
    "reqwest",
    "derive",
    "native-tls",
] }
rmcp = { version = "2.0", optional = true, default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
process-wrap = { version = "9", optional = true, default-features = true, features = ["tokio1"] }
which = { version = "8", optional = true }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1.1"
tokio = { version = "1", features = [
    "rt",
    "macros",
    "sync",
    "time",
    "process",
    "signal",
    "fs",
] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "native-tls",
    "charset",
    "http2",
    "system-proxy",
] }
dirs = "6"
sha2 = "0.10"
unicase = "2"
unicode-normalization = "0.1"
compact_str = { version = "0.10", features = ["serde"] }
smallvec = "1"
regex = "1"
unicode-width = "0.2"
ignore = "0.4"
pulldown-cmark = "0.13"
include_dir = "0.7"
http = "1"
agent-client-protocol = { version = "1.0.1", optional = true }
blocking = { version = "1", optional = true }
lsp-types = { version = "0.97", optional = true }
rquickjs = { version = "0.12", default-features = false, features = ["std"], optional = true }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
matrixmultiply = { version = "0.3.11", optional = true, features = ["threading"] }
hnsw_rs = { version = "0.3.4", optional = true }
fastembed = { version = "5", optional = true }
ort = { version = "=2.0.0-rc.13", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["signal", "process", "term"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["process", "thread"] }
seccompiler = "0.5"

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.10"
security-framework = "3.7"
security-framework-sys = "2.17"

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
rig = { package = "rig-core", version = "0.40", features = ["test-utils"] }
syn = { version = "2", features = ["full", "visit"] }

[build-dependencies]
sha2 = "0.10"

[profile.dev]
opt-level = 0
debug = false

# Rig 0.40 aggregates run-level Usage with unchecked arithmetic before it
# yields each CompletionCall. Let that private aggregate wrap in debug builds;
# mini-agent accounts from the exact per-call events with saturating arithmetic.
[profile.dev.package.rig-core]
overflow-checks = false
codegen-units = 16
incremental = true

# Exact 100k skill retrieval delegates its contiguous matrix-vector product to
# this small kernel crate. Keep the kernel representative in debug builds while
# the rest of mini-agent remains unoptimized and easy to inspect.
[profile.dev.package.matrixmultiply]
opt-level = 3

[profile.dev.package.hnsw_rs]
opt-level = 3

[profile.dev.package.anndists]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
debug = false

[project]
name = "mini-agent-client"
version = "0.1.0"
description = "Client for mini-agent's stream-json control protocol (mini-agent-control/1)"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mini_agent_client"]

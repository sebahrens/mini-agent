package:
  name: zerostack
  version: 1.9.4

source:
  url: https://github.com/sebahrens/mini-agent/releases/download/v1.9.4/mini-agent-v1.9.4-source.tar.gz
  sha256: 38a4e39e37c42cf29c8618589f0bb08fd0a350bea75cda1bcdb2eb565bd37f1c

build:
  number: 0
  script_env:
    - CARGO_PROFILE_RELEASE_STRIP=symbols
    - CARGO_PROFILE_RELEASE_LTO=fat

requirements:
  build:
    - "{{ stdlib('c') }}"
    - "{{ compiler('c') }}"
    - "{{ compiler('rust') }}"
    - cargo-bundle-licenses
    - cargo-auditable

test:
  commands:
    - mini-agent --help
    - mini-agent --version
    - test -f ${PREFIX}/THIRDPARTY.yml

about:
  home: https://github.com/sebahrens/mini-agent
  summary: Minimalistic coding agent written in Rust, optimized for memory footprint and performance
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  documentation: https://github.com/sebahrens/mini-agent
  repository: https://github.com/sebahrens/mini-agent

extra:
  recipe-maintainers:
    - sebahrens

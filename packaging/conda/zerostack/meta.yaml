package:
  name: zerostack
  version: 1.7.2

source:
  url: https://github.com/sebahrens/mini-agent/archive/refs/tags/v1.7.2.tar.gz
  sha256: ec28bc735b683b0c556388c898cc528affd5109ffccc026f36d64702e63561ee

build:
  number: 0
  script_env:
    - CARGO_PROFILE_RELEASE_STRIP=symbols
    - CARGO_PROFILE_RELEASE_LTO=fat

requirements:
  build:
    - "{{ stdlib('c') }}"
    - "{{ compiler('c') }}"
    - "{{ compiler('rust') }}"
    - cargo-bundle-licenses
    - cargo-auditable

test:
  commands:
    - mini-agent --help
    - mini-agent --version
    - test -f ${PREFIX}/THIRDPARTY.yml

about:
  home: https://github.com/sebahrens/mini-agent
  summary: Minimalistic coding agent written in Rust, optimized for memory footprint and performance
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  documentation: https://github.com/sebahrens/mini-agent
  repository: https://github.com/sebahrens/mini-agent

extra:
  recipe-maintainers:
    - sebahrens

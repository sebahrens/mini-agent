package:
  name: zerostack
  version: 1.7.2

source:
  url: https://github.com/sebahrens/mini-agent/releases/download/v1.7.2/mini-agent-v1.7.2-source.tar.gz
  sha256: 340bcf05c0a3f2b47b5f6a5b68eff89ff3400e4192e4a2371e9301f9558f0011

build:
  number: 1
  script_env:
    - CARGO_PROFILE_RELEASE_STRIP=symbols
    - CARGO_PROFILE_RELEASE_LTO=fat

requirements:
  build:
    - "{{ stdlib('c') }}"
    - "{{ compiler('c') }}"
    - "{{ compiler('rust') }}"
    - cargo-bundle-licenses
    - cargo-auditable

test:
  commands:
    - mini-agent --help
    - mini-agent --version
    - test -f ${PREFIX}/THIRDPARTY.yml

about:
  home: https://github.com/sebahrens/mini-agent
  summary: Minimalistic coding agent written in Rust, optimized for memory footprint and performance
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  documentation: https://github.com/sebahrens/mini-agent
  repository: https://github.com/sebahrens/mini-agent

extra:
  recipe-maintainers:
    - sebahrens

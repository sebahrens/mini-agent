package:
  name: zerostack-bin
  version: 1.9.4

source:
  - url: https://github.com/sebahrens/mini-agent/releases/download/v1.9.4/mini-agent-x86_64-unknown-linux-musl.tar.gz  # [linux and x86_64]
    sha256: ab9feae6f7b7ffe3de03b8068847651c564671c3c74782ba5141f308d6653cd0
  - url: https://github.com/sebahrens/mini-agent/releases/download/v1.9.4/mini-agent-aarch64-unknown-linux-musl.tar.gz  # [linux and aarch64]
    sha256: 2cd1fbcbc593456ae4eaac08a37005985d54c8261572ac31ef6a44e1f459141c
  - url: https://raw.githubusercontent.com/sebahrens/mini-agent/v1.9.4/LICENSE
    sha256: 3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986

build:
  number: 0
  binary_relocation: false

requirements:
  build: []
  host: []
  run: []

test:
  commands:
    - mini-agent --help
    - mini-agent --version
    - test -f ${PREFIX}/share/licenses/zerostack-bin/THIRD_PARTY_LICENSES

about:
  home: https://github.com/sebahrens/mini-agent
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - THIRD_PARTY_LICENSES
  summary: Minimalistic coding agent written in Rust, optimized for memory footprint and performance
  # conda has no optional-dependency field, and the sandbox only trusts a root-owned system
  # bubblewrap, so the prerequisite is documented rather than declared under requirements.
  description: |
    Linux prerequisite: the default subprocess sandbox and the JS runtime use the system
    bubblewrap (bwrap) executable, installed by the OS package manager (for example
    `sudo apt install bubblewrap`), not from conda. On Ubuntu 23.10+/24.04, AppArmor's
    unprivileged user-namespace restriction must also allow bwrap. See "Linux prerequisites"
    in https://github.com/sebahrens/mini-agent#linux-prerequisites

extra:
  recipe-maintainers:
    - sebahrens

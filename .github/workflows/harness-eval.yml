name: Nightly harness evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * *'

permissions:
  contents: read

env:
  RUSTFLAGS: ''

concurrency:
  group: harness-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Run deterministic task-level evaluation
        shell: bash
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/harness-eval.log"
          cargo test --locked harness_regression_eval -- --ignored --nocapture --test-threads=1 2>&1 |
            tee -a "$RUNNER_TEMP/harness-eval.log"
          cargo test --locked persona_regression_eval -- --ignored --nocapture --test-threads=1 2>&1 |
            tee -a "$RUNNER_TEMP/harness-eval.log"
          # libtest prints its progress line and the test's first captured
          # record on the same line, so a line-anchored grep drops exactly that
          # record. The extractor matches the marker anywhere, validates each
          # record as JSON against its schema, and enforces the counts.
          python3 scripts/harness_eval_metrics.py \
            --marker HARNESS_EVAL \
            --log "$RUNNER_TEMP/harness-eval.log" \
            --out "$RUNNER_TEMP/harness-eval.jsonl" \
            --expect 5
          python3 scripts/harness_eval_metrics.py \
            --marker PERSONA_EVAL \
            --log "$RUNNER_TEMP/harness-eval.log" \
            --out "$RUNNER_TEMP/persona-eval.jsonl" \
            --expect 9

      # The library-axis eval is cfg-gated on `skills` + `sandbox`, and its
      # module on `js` + `subagents`. `skills` is not a default feature, so the
      # default-feature step above cannot compile the test at all; it needs its
      # own explicitly featured build. It is not `#[ignore]`d, so it runs by
      # name without `--ignored`. Its records go to a separate log, leaving the
      # two counts above measuring only the deterministic fixture suites.
      - name: Run the gated learned-skill library axis
        shell: bash
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/library-axis-eval.log"
          cargo test --locked --no-default-features \
            --features js,skills,sandbox,subagents \
            tests::harness_eval_tests::task_json_library_axis_uses_real_store_and_records_oracles \
            -- --exact --nocapture --test-threads=1 2>&1 |
            tee -a "$RUNNER_TEMP/library-axis-eval.log"
          # The record count tracks the task document, which grows; assert the
          # shape instead, so a silently skipped or single-armed run still fails.
          python3 scripts/harness_eval_metrics.py \
            --marker HARNESS_EVAL \
            --log "$RUNNER_TEMP/library-axis-eval.log" \
            --out "$RUNNER_TEMP/library-axis-eval.jsonl" \
            --min 1 \
            --require library=none \
            --require library=library

      - name: Archive harness metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-eval-metrics
          path: |
            ${{ runner.temp }}/harness-eval.jsonl
            ${{ runner.temp }}/persona-eval.jsonl
            ${{ runner.temp }}/library-axis-eval.jsonl
          if-no-files-found: error

      # A failed extraction or a failed test is exactly when the raw output is
      # needed, so archive the logs even then.
      - name: Archive harness diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-eval-logs
          path: |
            ${{ runner.temp }}/harness-eval.log
            ${{ runner.temp }}/library-axis-eval.log
          if-no-files-found: warn

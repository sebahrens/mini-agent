name: Nightly harness evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * *'

permissions:
  contents: read

env:
  RUSTFLAGS: ''

concurrency:
  group: harness-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Run deterministic task-level evaluation
        shell: bash
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/harness-eval.log"
          cargo test --locked harness_regression_eval -- --ignored --nocapture --test-threads=1 2>&1 |
            tee -a "$RUNNER_TEMP/harness-eval.log"
          cargo test --locked persona_regression_eval -- --ignored --nocapture --test-threads=1 2>&1 |
            tee -a "$RUNNER_TEMP/harness-eval.log"
          grep '^HARNESS_EVAL ' "$RUNNER_TEMP/harness-eval.log" |
            sed 's/^HARNESS_EVAL //' > "$RUNNER_TEMP/harness-eval.jsonl"
          test "$(wc -l < "$RUNNER_TEMP/harness-eval.jsonl")" -eq 5
          grep '^PERSONA_EVAL ' "$RUNNER_TEMP/harness-eval.log" |
            sed 's/^PERSONA_EVAL //' > "$RUNNER_TEMP/persona-eval.jsonl"
          test "$(wc -l < "$RUNNER_TEMP/persona-eval.jsonl")" -eq 9

      - name: Archive harness metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-eval-metrics
          path: |
            ${{ runner.temp }}/harness-eval.jsonl
            ${{ runner.temp }}/persona-eval.jsonl
          if-no-files-found: error

name: Windows ARM64 native smoke

# Builds the default-feature binary natively on a GitHub-hosted Windows ARM64
# runner and exercises the checks that depend on the host: the JS worker LPAC
# self-check and the Git runtime check. It is non-publishing; the release
# release workflow ships the ARM64 archive (see docs/development/windows-arm64.md).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CANONICAL_BINARY: mini-agent
  RELEASE_TARGET: aarch64-pc-windows-msvc
  RUSTFLAGS: ""

jobs:
  smoke-windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare guarded Git runtime
        uses: ./.github/actions/prepare-git-runtime
        with:
          target: ${{ env.RELEASE_TARGET }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.96.0"
          target: ${{ env.RELEASE_TARGET }}

      - name: Build the native ARM64 binary
        run: cargo build --locked --release --target "$RELEASE_TARGET"

      - name: Version and runtime self-checks
        run: |
          bin="target/$RELEASE_TARGET/release/${CANONICAL_BINARY}.exe"
          "$bin" --version | grep -Fq -- "$CANONICAL_BINARY "
          "$bin" --js-runtime-check
          "$bin" --git-runtime-check

      - name: Package the candidate archive
        run: |
          python3 scripts/package-release-binary.py \
            --binary "target/$RELEASE_TARGET/release/${CANONICAL_BINARY}.exe" \
            --archive "${CANONICAL_BINARY}-${RELEASE_TARGET}.tar.gz" \
            --executable-name "${CANONICAL_BINARY}.exe" \
            --third-party-licenses THIRD_PARTY_LICENSES || true

      - name: Upload the private archive candidate
        if: hashFiles('mini-agent-aarch64-pc-windows-msvc.tar.gz') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-arm64-archive-candidate
          path: mini-agent-aarch64-pc-windows-msvc.tar.gz
          retention-days: 3

name: CI
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        required: true
        default: windows-git-scratch
        options:
          - windows-git-scratch
permissions:
  contents: read
concurrency:
  group: windows-git-scratch-${{ github.ref }}
  cancel-in-progress: false
env:
  RUSTFLAGS: ''
jobs:
  windows-default-compile:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare guarded Git runtime
        uses: ./.github/actions/prepare-git-runtime
        with:
          collect-sources: "false"
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          rustflags: ''
      - name: Execute exact private-directory and guarded Git controls
        shell: pwsh
        run: |
          $filters = @(
            'fs::private::windows::exclusive_private_directory_has_current_owner_closed_acl_and_never_adopts'
            'git::runner::windows_runtime_tests::windows_embedded_http_global_helpers_with_cmd_only_path_and_spaces'
            'git::runner::windows_runtime_tests::windows_shell_service_rejects_overlap_later_grants_and_replacement'
            'git::runner::windows_runtime_tests::windows_missing_shell_refuses_only_selected_shell_services'
          )
          $listing = @(& cargo test --locked --bin mini-agent -- @filters --list)
          if ($LASTEXITCODE -ne 0) { throw 'Native owning control discovery failed' }
          $actual = @($listing | ForEach-Object { $_.ToString().Trim() } | Where-Object { $_ -match ': test$' } | Sort-Object)
          $expected = @($filters | ForEach-Object { "${_}: test" } | Sort-Object)
          $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
          if ($actual.Count -ne 4 -or $difference.Count -ne 0) { throw 'Expected the exact four native owning controls' }
          $result = @(& cargo test --locked --bin mini-agent -- @filters --nocapture --test-threads=1)
          $exit = $LASTEXITCODE
          $result | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0 -or -not ($result -match '^test result: ok\. 4 passed; 0 failed; 0 ignored;')) { throw 'Native owning controls failed' }

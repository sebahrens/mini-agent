name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - phase6-integration
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

# setup-rust-toolchain defaults to promoting every rustc warning to an error.
# Cargo tests and install/package smoke jobs must retain their own warning
# policy; Clippy below explicitly opts back into `-D warnings`.
env:
  RUSTFLAGS: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Check formatting
        run: cargo fmt --check

      - name: Test loop lifecycle
        run: python3 -m unittest scripts.tests.test_loop_lifecycle

      - name: Test Cargo feature graph gate
        run: python3 -m unittest scripts.tests.test_check_feature_graph

      - name: Test Phase 6 cross-platform CI gate
        run: python3 -m unittest scripts.tests.test_phase6_ci_workflow

      - name: Test release workflow policy
        run: python3 -m unittest scripts.tests.test_check_package_metadata

      - name: Verify release workflow policy
        run: python3 scripts/check-package-metadata.py

      - name: Verify Cargo feature graph
        run: python3 scripts/check_feature_graph.py

  clippy:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # Explicit supported rows rather than --all-features. The isolated memory
        # and sandbox rows catch missing cfg gates that the default row can mask.
        # --all-features would enable `skills-embed`, pulling ort-sys (ONNX
        # Runtime), which has no prebuilt binaries for some hosts and adds a
        # large native download to every run. That backend is exercised by the
        # optional job below.
        features:
          - ""
          - "--no-default-features"
          - "--no-default-features --features memory"
          - "--no-default-features --features sandbox"
          - "--no-default-features --features js,skills"
          - "--no-default-features --features mcp,js,sandbox,skills,memory"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Run Clippy (${{ matrix.features }})
        # Feature-isolated rows intentionally compile shared Phase 6 types that
        # are consumed only by another supported row. Keep Clippy strict for
        # real diagnostics without treating that cross-row dead code as an
        # error in every individual configuration.
        run: cargo clippy --locked ${{ matrix.features }} -- -D warnings -A dead-code

  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The documented supported feature combinations. Isolated memory and
        # sandbox rows catch missing cfg gates that default features can mask.
        # `skills` implies `js`, so a skills-without-JS state is unselectable by
        # construction.
        features:
          - ""
          - "--no-default-features"
          - "--no-default-features --features memory"
          - "--no-default-features --features js"
          - "--no-default-features --features sandbox"
          - "--no-default-features --features skills"
          - "--no-default-features --features js,sandbox"
          - "--no-default-features --features mcp"
          - "--no-default-features --features js,skills"
          - "--no-default-features --features mcp,js,sandbox,skills,memory"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub's macOS runner work-temp volume does not provide the durable
      # directory-sync semantics required by private persistence tests.
      - name: Use the durable macOS temporary root
        if: matrix.os == 'macos-latest'
        shell: bash
        run: echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Test (${{ matrix.features }}) on Linux
        if: matrix.os != 'macos-latest'
        run: cargo test --locked ${{ matrix.features }}

      - name: Test (${{ matrix.features }}) on macOS with process-global worker isolation
        if: matrix.os == 'macos-latest'
        run: >-
          cargo test --locked ${{ matrix.features }} -- --test-threads=1
          --skip extras::js::tool::js_permission_bridge::js_supervisor_agent_rebuild_reuses_worker_and_stops_old_permission_receiver

      - name: Test macOS agent-rebuild worker reuse in a fresh process
        if: >-
          matrix.os == 'macos-latest' &&
          (matrix.features == '' || contains(matrix.features, 'js') || contains(matrix.features, 'skills'))
        run: >-
          cargo test --locked ${{ matrix.features }}
          extras::js::tool::js_permission_bridge::js_supervisor_agent_rebuild_reuses_worker_and_stops_old_permission_receiver
          -- --exact --test-threads=1

      - name: Validate deterministic skill retrieval benchmark metrics
        if: matrix.os == 'ubuntu-latest' && matrix.features == '--no-default-features --features js,skills'
        run: cargo test --locked --no-default-features --features js,skills skill_retrieval_benchmark_smoke -- --nocapture

      - name: Compile the full Phase 5 operations audit
        if: matrix.os == 'ubuntu-latest' && matrix.features == '--no-default-features --features js,skills'
        run: cargo test --locked --no-default-features --features js,skills phase5_operations_benchmark

  # The local ONNX/BGE embedding backend. Kept out of the required matrix because
  # ort-sys ships no prebuilt binaries for every host (notably x86_64-apple-darwin)
  # and downloading the runtime makes the job slow and network-dependent. Failure
  # here signals that `skills-embed` needs attention; it does not block the build.
  skills-embed-optional:
    if: github.event_name != 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Test (--no-default-features --features skills-embed)
        run: cargo test --locked --no-default-features --features skills-embed

  linux-sandbox-policy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Enable the hosted runner's unprivileged namespace boundary
        shell: bash
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Test Linux sandbox capability policy
        run: cargo test --locked linux_sandbox_policy

      - name: Test shared sandbox module
        # Keep the trailing Rust module separator inside a YAML block scalar.
        run: >-
          cargo test --locked sandbox::

      - name: Verify Linux Phase 6 probes and adversarial suites are present
        shell: bash
        run: |
          js_tests=$(cargo test --locked --no-default-features --features js -- --list)
          skills_tests=$(cargo test --locked --no-default-features --features skills -- --list)
          containment_count=$(printf '%s\n' "$js_tests" | grep -c '^extras::js::tests::worker_containment::linux_js_worker_containment: test$')
          test "$containment_count" -eq 1

          require_suite() {
            listing=$1
            name=$2
            pattern=$3
            count=$(printf '%s\n' "$listing" | grep -Ec "$pattern" || true)
            if [ "$count" -lt 1 ]; then
              echo "$name must execute at least one test" >&2
              exit 1
            fi
          }
          for listing in "$js_tests" "$skills_tests"; do
            require_suite "$listing" worker_protocol '^extras::js::tests::worker_protocol::'
            require_suite "$listing" worker_runtime '^extras::js::tests::worker_runtime::worker_runtime_'
            require_suite "$listing" worker_supervisor '^extras::js::tests::worker_runtime::worker_supervisor_'
            require_suite "$listing" worker_broker '^extras::js::tests::worker_broker::worker_broker_'
            require_suite "$listing" js_effect_audit '^extras::js::tests::worker_broker::js_effect_audit_'
            require_suite "$listing" worker_fault_matrix '^extras::js::tests::worker_fault_matrix::'
            require_suite "$listing" javascript_worker_status '^(agent::builder::js_tests::unavailable_worker_containment_|print::tests::config_reports_)'
          done
          require_suite "$skills_tests" skill_realm_isolation '^extras::js::tests::skill_realm_isolation::'
          require_suite "$skills_tests" capability_manifest_v2 '^extras::js::tests::capability_manifest_v2::'
          require_suite "$skills_tests" worker_verifier '^extras::js::tests::worker_runtime::worker_runtime_verification_'
          require_suite "$skills_tests" skill_held_out_evaluator '^extras::js::tests::skill_held_out_evaluator::'
          require_suite "$skills_tests" skill_admission_gate '^extras::js::tests::skill_admission_gate::'

      - name: Test Linux JS worker containment
        shell: bash
        run: |
          cargo test --locked --no-default-features --features js \
            linux_js_worker_containment -- --ignored --nocapture
          echo 'PHASE6_REAL_PROBE=passed' >> "$GITHUB_ENV"

      - name: Measure Linux JS worker resources without gating noisy timing percentiles
        shell: bash
        run: |
          benchmark_root="${RUNNER_TEMP}/js-worker-benchmark-install"
          cargo install --locked --path . --debug --no-default-features --features js \
            --root "$benchmark_root"
          export MINI_AGENT_JS_WORKER_BENCH_EXE="$benchmark_root/bin/mini-agent"
          MINI_AGENT_JS_WORKER_BENCH=1 \
          MINI_AGENT_JS_WORKER_BENCH_OUTPUT="${RUNNER_TEMP}/js-worker-${RUNNER_OS}-reference.json" \
            cargo test --locked --no-default-features --features js \
              js_worker_resource_benchmark -- --ignored --nocapture
          MINI_AGENT_JS_WORKER_BENCH=1 \
          MINI_AGENT_JS_WORKER_BENCH_COMPARE="${RUNNER_TEMP}/js-worker-${RUNNER_OS}-reference.json" \
          MINI_AGENT_JS_WORKER_BENCH_OUTPUT="${RUNNER_TEMP}/js-worker-${RUNNER_OS}.json" \
            cargo test --locked --no-default-features --features js \
              js_worker_resource_benchmark -- --ignored --nocapture
          echo 'PHASE6_RESOURCE=recorded' >> "$GITHUB_ENV"

      - name: Archive Linux JS worker resource measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: js-worker-resource-${{ runner.os }}
          path: ${{ runner.temp }}/js-worker-${{ runner.os }}.json
          if-no-files-found: error

      - name: Run Phase 6 adversarial suites under js and skills
        shell: bash
        run: |
          shared_suites=(
            'extras::js::tests::worker_protocol::'
            'extras::js::tests::worker_runtime::worker_runtime_'
            'extras::js::tests::worker_runtime::worker_supervisor_'
            'extras::js::tests::worker_broker::worker_broker_'
            'extras::js::tests::worker_broker::js_effect_audit_'
            'extras::js::tests::worker_fault_matrix::'
            'agent::builder::js_tests::unavailable_worker_containment_'
            'print::tests::config_reports_'
          )
          skills_suites=(
            'extras::js::tests::skill_realm_isolation::'
            'extras::js::tests::capability_manifest_v2::'
            'extras::js::tests::worker_runtime::worker_runtime_verification_'
            'extras::js::tests::skill_held_out_evaluator::'
            'extras::js::tests::skill_admission_gate::'
          )
          for features in js skills; do
            for suite in "${shared_suites[@]}"; do
              cargo test --locked --no-default-features --features "$features" \
                "$suite" -- --test-threads=1
            done
          done
          for suite in "${skills_suites[@]}"; do
            cargo test --locked --no-default-features --features skills \
              "$suite" -- --test-threads=1
          done
          echo 'PHASE6_ADVERSARIAL=passed' >> "$GITHUB_ENV"

      - name: Test JS spawn parity through the shared sandbox
        run: cargo test --locked --features js,sandbox

      - name: Test immutable learned-skill executable snapshots
        shell: bash
        run: |
          tests=$(cargo test --locked --no-default-features --features js,sandbox,skills -- --list)
          fail_closed_count=$(printf '%s\n' "$tests" | grep -c '^extras::js::host::tests::learned_skill_spawn_fails_closed_on_linux_without_snapshot_backend: test$')
          snapshot_count=$(printf '%s\n' "$tests" | grep -c '^extras::js::host::tests::linux_spawn_.*: test$')
          test "$fail_closed_count" -eq 1
          test "$snapshot_count" -eq 3
          cargo test --locked --no-default-features --features js,sandbox,skills learned_skill_spawn_fails_closed_on_linux_without_snapshot_backend
          cargo test --locked --no-default-features --features js,sandbox,skills linux_spawn_ -- --ignored --nocapture

      - name: Write source-free Phase 6 gate evidence
        if: always()
        shell: pwsh
        run: |
          $probe = if ($env:PHASE6_REAL_PROBE) { $env:PHASE6_REAL_PROBE } else { 'not-run' }
          $adversarial = if ($env:PHASE6_ADVERSARIAL) { $env:PHASE6_ADVERSARIAL } else { 'not-run' }
          @{
            schema_version = 1
            platform = 'linux'
            runner = 'ubuntu-latest'
            result = '${{ job.status }}'
            containment = @{
              backend = 'bubblewrap'
              assurance = 'enforced'
              real_probe = $probe
              native_resource_gate = 'rlimit-seccomp-probed'
            }
            adversarial = @{
              feature_rows = @('js', 'skills')
              suites = $adversarial
              zero_test_guard = 'enforced'
            }
            raw_output = $false
          } | ConvertTo-Json -Depth 4 | Set-Content 'phase6-gate-evidence.json'
          "PHASE6_GATE platform=linux result=${{ job.status }} probe=$probe suites=$adversarial raw_output=false" |
            Set-Content 'phase6-gate-evidence.log'

      - name: Archive source-free Phase 6 gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase6-worker-gate-linux
          path: |
            phase6-gate-evidence.json
            phase6-gate-evidence.log
          if-no-files-found: error

  macos-worker-containment-gate:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      # Use the native APFS temporary root: the runner work-temp volume rejects
      # the directory fsync required by the effect-audit durability contract.
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''

      - name: Reject a missing macOS Seatbelt blocker probe
        shell: bash
        run: |
          js_tests=$(cargo test --locked --no-default-features --features js -- --list)
          skills_tests=$(cargo test --locked --no-default-features --features skills -- --list)
          containment_count=$(printf '%s\n' "$js_tests" | grep -c '^extras::js::tests::worker_containment::macos_js_worker_containment: test$')
          test "$containment_count" -eq 1

          require_suite() {
            listing=$1
            name=$2
            pattern=$3
            count=$(printf '%s\n' "$listing" | grep -Ec "$pattern" || true)
            if [ "$count" -lt 1 ]; then
              echo "$name must execute at least one test" >&2
              exit 1
            fi
          }
          for listing in "$js_tests" "$skills_tests"; do
            require_suite "$listing" worker_protocol '^extras::js::tests::worker_protocol::'
            require_suite "$listing" worker_runtime '^extras::js::tests::worker_runtime::worker_runtime_'
            require_suite "$listing" worker_supervisor '^extras::js::tests::worker_runtime::worker_supervisor_'
            require_suite "$listing" worker_broker '^extras::js::tests::worker_broker::worker_broker_'
            require_suite "$listing" js_effect_audit '^extras::js::tests::worker_broker::js_effect_audit_'
            require_suite "$listing" worker_fault_matrix '^extras::js::tests::worker_fault_matrix::'
            require_suite "$listing" javascript_worker_status '^(agent::builder::js_tests::unavailable_worker_containment_|print::tests::config_reports_)'
          done
          require_suite "$skills_tests" skill_realm_isolation '^extras::js::tests::skill_realm_isolation::'
          require_suite "$skills_tests" capability_manifest_v2 '^extras::js::tests::capability_manifest_v2::'
          require_suite "$skills_tests" worker_verifier '^extras::js::tests::worker_runtime::worker_runtime_verification_'
          require_suite "$skills_tests" skill_held_out_evaluator '^extras::js::tests::skill_held_out_evaluator::'
          require_suite "$skills_tests" skill_admission_gate '^extras::js::tests::skill_admission_gate::'

      - name: Validate the real macOS Seatbelt fail-closed gate
        shell: bash
        run: |
          cargo test --locked --no-default-features --features js \
            macos_js_worker_containment -- --ignored --nocapture
          echo 'PHASE6_REAL_PROBE=passed' >> "$GITHUB_ENV"

      - name: Measure macOS JS worker resources without gating noisy timing percentiles
        if: matrix.os == 'macos-26'
        shell: bash
        run: |
          benchmark_root="${RUNNER_TEMP}/js-worker-benchmark-install"
          cargo install --locked --path . --debug --no-default-features --features js \
            --root "$benchmark_root"
          export MINI_AGENT_JS_WORKER_BENCH_EXE="$benchmark_root/bin/mini-agent"
          MINI_AGENT_JS_WORKER_BENCH=1 \
          MINI_AGENT_JS_WORKER_BENCH_OUTPUT="${RUNNER_TEMP}/js-worker-${RUNNER_OS}-reference.json" \
            cargo test --locked --no-default-features --features js \
              js_worker_resource_benchmark -- --ignored --nocapture
          MINI_AGENT_JS_WORKER_BENCH=1 \
          MINI_AGENT_JS_WORKER_BENCH_COMPARE="${RUNNER_TEMP}/js-worker-${RUNNER_OS}-reference.json" \
          MINI_AGENT_JS_WORKER_BENCH_OUTPUT="${RUNNER_TEMP}/js-worker-${RUNNER_OS}.json" \
            cargo test --locked --no-default-features --features js \
              js_worker_resource_benchmark -- --ignored --nocapture
          echo 'PHASE6_RESOURCE=recorded' >> "$GITHUB_ENV"

      - name: Archive macOS JS worker resource measurements
        if: always() && matrix.os == 'macos-26'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: js-worker-resource-${{ runner.os }}
          path: ${{ runner.temp }}/js-worker-${{ runner.os }}.json
          if-no-files-found: error

      - name: Run Phase 6 adversarial suites under js and skills
        shell: bash
        run: |
          shared_suites=(
            'extras::js::tests::worker_protocol::'
            'extras::js::tests::worker_runtime::worker_runtime_'
            'extras::js::tests::worker_runtime::worker_supervisor_'
            'extras::js::tests::worker_broker::worker_broker_'
            'extras::js::tests::worker_broker::js_effect_audit_'
            'extras::js::tests::worker_fault_matrix::'
            'agent::builder::js_tests::unavailable_worker_containment_'
            'print::tests::config_reports_'
          )
          skills_suites=(
            'extras::js::tests::skill_realm_isolation::'
            'extras::js::tests::capability_manifest_v2::'
            'extras::js::tests::worker_runtime::worker_runtime_verification_'
            'extras::js::tests::skill_held_out_evaluator::'
            'extras::js::tests::skill_admission_gate::'
          )
          for features in js skills; do
            for suite in "${shared_suites[@]}"; do
              cargo test --locked --no-default-features --features "$features" \
                "$suite" -- --test-threads=1
            done
          done
          for suite in "${skills_suites[@]}"; do
            cargo test --locked --no-default-features --features skills \
              "$suite" -- --test-threads=1
          done
          echo 'PHASE6_ADVERSARIAL=passed' >> "$GITHUB_ENV"

      - name: Write source-free Phase 6 gate evidence
        if: always()
        shell: pwsh
        run: |
          $probe = if ($env:PHASE6_REAL_PROBE) { $env:PHASE6_REAL_PROBE } else { 'not-run' }
          $adversarial = if ($env:PHASE6_ADVERSARIAL) { $env:PHASE6_ADVERSARIAL } else { 'not-run' }
          $resource = if ($env:PHASE6_RESOURCE) { $env:PHASE6_RESOURCE } else { 'not-run' }
          @{
            schema_version = 1
            platform = 'macos'
            runner = '${{ matrix.os }}'
            result = '${{ job.status }}'
            containment = @{
              backend = 'seatbelt'
              assurance = 'deprecated-best-effort-fail-closed'
              real_probe = $probe
              resource_measurement = $resource
              native_resource_gate = 'unavailable-no-production-worker'
            }
            adversarial = @{
              feature_rows = @('js', 'skills')
              suites = $adversarial
              zero_test_guard = 'enforced'
            }
            raw_output = $false
          } | ConvertTo-Json -Depth 4 | Set-Content 'phase6-gate-evidence.json'
          "PHASE6_GATE platform=macos runner=${{ matrix.os }} result=${{ job.status }} probe=$probe suites=$adversarial raw_output=false" |
            Set-Content 'phase6-gate-evidence.log'

      - name: Archive source-free Phase 6 gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase6-worker-gate-${{ matrix.os }}
          path: |
            phase6-gate-evidence.json
            phase6-gate-evidence.log
          if-no-files-found: error

  windows-worker-launcher-unit:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''

      - name: Verify exact Windows production launcher test discovery
        shell: pwsh
        run: |
          $output = cargo test --locked --no-default-features --features js -- --list 2>&1
          if ($LASTEXITCODE -ne 0) {
            $output | Write-Output
            exit $LASTEXITCODE
          }
          $actual = @(
            $output |
              ForEach-Object { $_.ToString().Trim() } |
              Where-Object { $_ -match '^.*windows_production_.*: test$' } |
              Sort-Object
          )
          $expected = @(
            'extras::js::tests::worker_runtime::windows_production_supervisor_rejects_nonproduction_test_image: test'
            'sandbox::worker::platform::tests::windows_production_failure_child: test'
            'sandbox::worker::platform::tests::windows_production_failure_injection_closes_raii_handles_and_reaps_children: test'
            'sandbox::worker::platform::tests::windows_production_creation_boundary_excludes_ordinary_piped_child: test'
            'sandbox::worker::platform::tests::windows_production_inheriting_process_lock_serializes_launch_windows: test'
            'sandbox::worker::platform::tests::windows_production_launch_uses_cached_unavailable_without_second_child: test'
            'sandbox::worker::platform::tests::windows_production_policy_has_required_limits_and_compatible_mitigations: test'
            'sandbox::worker::platform::tests::windows_production_status_fails_closed_for_nonproduction_test_image: test'
            'sandbox::worker::tests::windows_production_launcher_source_keeps_creation_time_authority_closed: test'
          ) | Sort-Object
          if ($actual.Count -eq 0) {
            throw 'No target-gated Windows production launcher tests were discovered'
          }
          $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
          if ($difference.Count -ne 0) {
            $difference | Format-Table | Out-String | Write-Output
            throw "Windows production launcher discovery differed from the exact expected set"
          }

      - name: Test Windows LPAC launcher policy and failure cleanup
        run: >-
          cargo test --locked --no-default-features --features js
          windows_production_ -- --nocapture --test-threads=1

  windows-worker-containment-gate:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''

      - name: Install the exact JS binary for Unicode-path containment cases
        shell: pwsh
        run: |
          # Keep dependency sources beneath an ASCII Cargo home because aws-lc's
          # NASM build cannot consume non-ASCII source paths. The native gate
          # itself creates and executes the reviewed space/Unicode install and
          # archive copies beneath this supported Cargo-install root.
          $installRoot = Join-Path $env:RUNNER_TEMP 'phase6-cargo-home'
          cargo install --locked --path . --debug --no-default-features --features js --root $installRoot
          if ($LASTEXITCODE -ne 0) {
            throw "cargo install failed with exit code $LASTEXITCODE"
          }
          $installed = Join-Path $installRoot 'bin\mini-agent.exe'
          if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
            throw "cargo install did not create $installed"
          }
          "CARGO_HOME=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MINI_AGENT_LPAC_CARGO_INSTALL_EXE=$installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare the protected machine-wide negative control
        shell: pwsh
        run: |
          $protectedRoot = Join-Path $env:ProgramFiles 'mini-agent-a27-gate'
          New-Item -ItemType Directory -Path $protectedRoot -Force | Out-Null
          $protected = Join-Path $protectedRoot 'mini-agent.exe'
          Copy-Item -LiteralPath $env:MINI_AGENT_LPAC_CARGO_INSTALL_EXE -Destination $protected -Force
          $currentSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $systemSid = [System.Security.Principal.SecurityIdentifier]::new('S-1-5-18')
          $none = [System.Security.AccessControl.InheritanceFlags]::None
          $propagation = [System.Security.AccessControl.PropagationFlags]::None
          $allow = [System.Security.AccessControl.AccessControlType]::Allow
          $deny = [System.Security.AccessControl.AccessControlType]::Deny

          function Protect-NegativeControl([string] $Path, [bool] $Directory) {
            if ($Directory) {
              $acl = [System.Security.AccessControl.DirectorySecurity]::new()
            } else {
              $acl = [System.Security.AccessControl.FileSecurity]::new()
            }
            $acl.SetAccessRuleProtection($true, $false)
            $acl.SetOwner($systemSid)
            $systemRule = [System.Security.AccessControl.FileSystemAccessRule]::new(
              $systemSid,
              [System.Security.AccessControl.FileSystemRights]::FullControl,
              $none,
              $propagation,
              $allow
            )
            $readRule = [System.Security.AccessControl.FileSystemAccessRule]::new(
              $currentSid,
              [System.Security.AccessControl.FileSystemRights]::ReadAndExecute,
              $none,
              $propagation,
              $allow
            )
            $deniedRights = [System.Security.AccessControl.FileSystemRights]::Write -bor
              [System.Security.AccessControl.FileSystemRights]::Delete -bor
              [System.Security.AccessControl.FileSystemRights]::ChangePermissions -bor
              [System.Security.AccessControl.FileSystemRights]::TakeOwnership
            if ($Directory) {
              $deniedRights = $deniedRights -bor
                [System.Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles
            }
            $denyRule = [System.Security.AccessControl.FileSystemAccessRule]::new(
              $currentSid,
              $deniedRights,
              $none,
              $propagation,
              $deny
            )
            [void] $acl.AddAccessRule($systemRule)
            [void] $acl.AddAccessRule($readRule)
            [void] $acl.AddAccessRule($denyRule)
            Set-Acl -LiteralPath $Path -AclObject $acl
          }

          Protect-NegativeControl -Path $protected -Directory $false
          Protect-NegativeControl -Path $protectedRoot -Directory $true
          "MINI_AGENT_LPAC_PROTECTED_EXE=$protected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reject missing or duplicate Windows containment probes
        shell: pwsh
        run: |
          $tests = cargo test --locked --no-default-features --features js -- --list
          if ($LASTEXITCODE -ne 0) {
            throw "test discovery failed with exit code $LASTEXITCODE"
          }
          $skillsTests = cargo test --locked --no-default-features --features skills -- --list
          if ($LASTEXITCODE -ne 0) {
            throw "skills test discovery failed with exit code $LASTEXITCODE"
          }
          $containment = @($tests | Select-String '^extras::js::tests::worker_containment::windows_js_worker_containment: test$')
          if ($containment.Count -ne 1) {
            throw "expected exactly one Windows containment probe, found $($containment.Count)"
          }

          function Assert-Suite([object[]] $Listing, [string] $Name, [string] $Pattern) {
            $matches = @($Listing | Select-String $Pattern)
            if ($matches.Count -lt 1) {
              throw "$Name must execute at least one test"
            }
          }
          function Assert-CoreSuites([object[]] $Listing) {
            Assert-Suite $Listing 'worker_protocol' '^extras::js::tests::worker_protocol::'
            Assert-Suite $Listing 'worker_runtime' '^extras::js::tests::worker_runtime::worker_runtime_'
            Assert-Suite $Listing 'worker_supervisor' '^extras::js::tests::worker_runtime::worker_supervisor_'
            Assert-Suite $Listing 'worker_broker' '^extras::js::tests::worker_broker::worker_broker_'
            Assert-Suite $Listing 'js_effect_audit' '^extras::js::tests::worker_broker::js_effect_audit_'
            Assert-Suite $Listing 'worker_fault_matrix' '^extras::js::tests::worker_fault_matrix::'
            Assert-Suite $Listing 'javascript_worker_status' '^(agent::builder::js_tests::unavailable_worker_containment_|print::tests::config_reports_)'
          }
          Assert-CoreSuites $tests
          Assert-CoreSuites $skillsTests
          Assert-Suite $skillsTests 'skill_realm_isolation' '^extras::js::tests::skill_realm_isolation::'
          Assert-Suite $skillsTests 'capability_manifest_v2' '^extras::js::tests::capability_manifest_v2::'
          Assert-Suite $skillsTests 'worker_verifier' '^extras::js::tests::worker_runtime::worker_runtime_verification_'
          Assert-Suite $skillsTests 'skill_held_out_evaluator' '^extras::js::tests::skill_held_out_evaluator::'
          Assert-Suite $skillsTests 'skill_admission_gate' '^extras::js::tests::skill_admission_gate::'

      - name: Validate the real Windows LPAC, Job, resource, and install-location gate
        shell: pwsh
        run: |
          cargo test --locked --no-default-features --features js windows_js_worker_containment -- --ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath windows-worker-containment.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Windows containment probe failed with exit code $LASTEXITCODE"
          }
          $evidence = Get-Content -LiteralPath windows-worker-containment.txt -Raw
          $expected = 'WINDOWS_CONTAINMENT_PASS backend=lpac job_close=pass nested_parent_job=pass protocol=pass'
          if (-not $evidence.Contains($expected)) {
            throw 'Windows containment probe emitted no exact fixed pass evidence'
          }
          'PHASE6_REAL_PROBE=passed' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Measure Windows JS worker resources without gating noisy timing percentiles
        shell: pwsh
        run: |
          $env:MINI_AGENT_JS_WORKER_BENCH = '1'
          $env:MINI_AGENT_JS_WORKER_BENCH_EXE = $env:MINI_AGENT_LPAC_CARGO_INSTALL_EXE
          $env:MINI_AGENT_JS_WORKER_BENCH_OUTPUT = "$env:RUNNER_TEMP/js-worker-$env:RUNNER_OS-reference.json"
          cargo test --locked --no-default-features --features js js_worker_resource_benchmark -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows JS worker reference resource record was not produced'
          }
          $env:MINI_AGENT_JS_WORKER_BENCH_COMPARE = "$env:RUNNER_TEMP/js-worker-$env:RUNNER_OS-reference.json"
          $env:MINI_AGENT_JS_WORKER_BENCH_OUTPUT = "$env:RUNNER_TEMP/js-worker-$env:RUNNER_OS.json"
          cargo test --locked --no-default-features --features js js_worker_resource_benchmark -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows JS worker resource record was not produced'
          }
          'PHASE6_RESOURCE=recorded' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Archive Windows JS worker resource measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: js-worker-resource-${{ runner.os }}
          path: ${{ runner.temp }}/js-worker-${{ runner.os }}.json
          if-no-files-found: error

      - name: Validate the complete gate from a separate standard-user installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $userName = 'phase6ci'
          if (Get-LocalUser -Name $userName -ErrorAction SilentlyContinue) {
            throw "the isolated Phase 6 standard-user account already exists"
          }
          $passwordText = 'P6!' + [guid]::NewGuid().ToString('N') + 'aA1'
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $user = New-LocalUser -Name $userName -Password $password -PasswordNeverExpires -UserMayNotChangePassword
          $ordinaryUser = Get-LocalGroupMember -Group 'Users' |
            Where-Object { $_.SID -eq $user.SID }
          if (-not $ordinaryUser) {
            Add-LocalGroupMember -Group 'Users' -Member $user
          }
          $administrator = Get-LocalGroupMember -Group 'Administrators' |
            Where-Object { $_.SID -eq $user.SID }
          if ($administrator) {
            throw 'the Phase 6 probe account unexpectedly has administrator authority'
          }

          # The native matrix creates Unicode install/archive children itself.
          # Keep Cargo source and dependency paths ASCII for aws-lc/NASM.
          $standardRoot = Join-Path $env:RUNNER_TEMP 'phase6-standard-user-build'
          $sourceArchive = Join-Path $standardRoot 'source.zip'
          $sourceRoot = Join-Path $standardRoot 'source-checkout'
          $cargoHome = Join-Path $standardRoot 'cargo-home'
          $userHome = Join-Path $standardRoot 'user-home'
          $userTemp = Join-Path $standardRoot 'user-temp'
          $evidenceRoot = Join-Path $standardRoot 'evidence'
          $buildEnvironment = Join-Path $standardRoot 'build-environment.json'
          New-Item -ItemType Directory -Path $standardRoot, $sourceRoot, $cargoHome, $userHome, $userTemp, $evidenceRoot -Force | Out-Null
          git archive --format=zip --output=$sourceArchive HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "git archive failed with exit code $LASTEXITCODE"
          }
          Expand-Archive -LiteralPath $sourceArchive -DestinationPath $sourceRoot

          $toolchainCargo = (rustup which cargo).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $toolchainCargo -PathType Leaf)) {
            throw 'rustup did not resolve the exact Cargo toolchain binary'
          }
          $toolchainBin = Split-Path -Parent $toolchainCargo
          $toolchainRoot = Split-Path -Parent $toolchainBin
          & icacls.exe $toolchainRoot /grant "${userName}:(OI)(CI)RX" /T /Q | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw 'could not grant the standard user read/execute access to the Rust toolchain'
          }
          & icacls.exe $standardRoot /setowner $userName /T /C /Q | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw 'could not assign the isolated checkout to the standard user'
          }
          & icacls.exe $standardRoot /grant "${userName}:(OI)(CI)M" /T /Q | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw 'could not grant the standard user access to its isolated checkout'
          }
          $sensitivePathRoots = @(
            $env:HOME,
            $env:USERPROFILE,
            $env:TEMP,
            $env:TMP,
            $env:RUNNER_TEMP,
            $env:GITHUB_WORKSPACE
          ) | Where-Object { $_ } | ForEach-Object {
            [System.IO.Path]::GetFullPath($_).TrimEnd('\')
          }
          function Test-RequiredBuildPath([string] $Candidate) {
            if (-not $Candidate) {
              return $false
            }
            try {
              $fullCandidate = [System.IO.Path]::GetFullPath($Candidate).TrimEnd('\')
            } catch {
              return $false
            }
            foreach ($sensitiveRoot in $sensitivePathRoots) {
              if ($fullCandidate.Equals($sensitiveRoot, [System.StringComparison]::OrdinalIgnoreCase) -or
                  $fullCandidate.StartsWith("$sensitiveRoot\", [System.StringComparison]::OrdinalIgnoreCase)) {
                return $false
              }
            }
            return $true
          }
          $buildPath = @($env:PATH -split ';' | Where-Object { Test-RequiredBuildPath $_ }) -join ';'
          if (-not $buildPath) {
            throw 'no non-user compiler path entries remained for the standard-user build'
          }
          @{
            PATH = $buildPath
            INCLUDE = $env:INCLUDE
            LIB = $env:LIB
            LIBPATH = $env:LIBPATH
            VCINSTALLDIR = $env:VCINSTALLDIR
            VCToolsInstallDir = $env:VCToolsInstallDir
            WindowsSdkDir = $env:WindowsSdkDir
            WindowsSDKVersion = $env:WindowsSDKVersion
            UCRTVersion = $env:UCRTVersion
            UniversalCRTSdkDir = $env:UniversalCRTSdkDir
          } | ConvertTo-Json | Set-Content -LiteralPath $buildEnvironment

          $protectedRoot = Join-Path $env:ProgramFiles 'mini-agent-a31-standard-user-gate'
          New-Item -ItemType Directory -Path $protectedRoot -Force | Out-Null
          $protected = Join-Path $protectedRoot 'mini-agent.exe'
          Copy-Item -LiteralPath $env:MINI_AGENT_LPAC_CARGO_INSTALL_EXE -Destination $protected -Force
          $systemSid = [System.Security.Principal.SecurityIdentifier]::new('S-1-5-18')
          $none = [System.Security.AccessControl.InheritanceFlags]::None
          $propagation = [System.Security.AccessControl.PropagationFlags]::None
          $allow = [System.Security.AccessControl.AccessControlType]::Allow
          $deny = [System.Security.AccessControl.AccessControlType]::Deny
          function Protect-StandardUserControl([string] $Path, [bool] $Directory) {
            if ($Directory) {
              $acl = [System.Security.AccessControl.DirectorySecurity]::new()
            } else {
              $acl = [System.Security.AccessControl.FileSecurity]::new()
            }
            $acl.SetAccessRuleProtection($true, $false)
            $acl.SetOwner($systemSid)
            [void] $acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new(
              $systemSid,
              [System.Security.AccessControl.FileSystemRights]::FullControl,
              $none,
              $propagation,
              $allow
            ))
            [void] $acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new(
              $user.SID,
              [System.Security.AccessControl.FileSystemRights]::ReadAndExecute,
              $none,
              $propagation,
              $allow
            ))
            $denied = [System.Security.AccessControl.FileSystemRights]::Write -bor
              [System.Security.AccessControl.FileSystemRights]::Delete -bor
              [System.Security.AccessControl.FileSystemRights]::ChangePermissions -bor
              [System.Security.AccessControl.FileSystemRights]::TakeOwnership
            if ($Directory) {
              $denied = $denied -bor [System.Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles
            }
            [void] $acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new(
              $user.SID,
              $denied,
              $none,
              $propagation,
              $deny
            ))
            Set-Acl -LiteralPath $Path -AclObject $acl
          }
          Protect-StandardUserControl -Path $protected -Directory $false
          Protect-StandardUserControl -Path $protectedRoot -Directory $true

          $probeScript = Join-Path $standardRoot 'run-standard-user-gate.ps1'
          @'
          param(
            [Parameter(Mandatory)][string] $CargoExe,
            [Parameter(Mandatory)][string] $ToolchainBin,
            [Parameter(Mandatory)][string] $SourceRoot,
            [Parameter(Mandatory)][string] $CargoHome,
            [Parameter(Mandatory)][string] $ProtectedExe,
            [Parameter(Mandatory)][string] $EvidenceRoot,
            [Parameter(Mandatory)][string] $BuildEnvironment,
            [Parameter(Mandatory)][string] $ExpectedAccount,
            [Parameter(Mandatory)][string] $UserHome,
            [Parameter(Mandatory)][string] $UserTemp
          )
          $ErrorActionPreference = 'Stop'
          $tokenIdentity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          if (-not [string]::Equals(
            $tokenIdentity.Name,
            $ExpectedAccount,
            [System.StringComparison]::OrdinalIgnoreCase
          )) {
            exit 10
          }
          $tokenPrincipal = [System.Security.Principal.WindowsPrincipal]::new($tokenIdentity)
          if ($tokenPrincipal.IsInRole([System.Security.Principal.WindowsBuiltInRole]::Administrator)) {
            exit 11
          }
          $forbiddenPrefixes = @('ACTIONS_', 'GITHUB_', 'RUNNER_', 'MINI_AGENT_')
          $inheritedSensitive = @(Get-ChildItem Env: | Where-Object {
            $name = $_.Name
            $hasForbiddenPrefix = @($forbiddenPrefixes | Where-Object {
              $name.StartsWith($_, [System.StringComparison]::OrdinalIgnoreCase)
            }).Count -ne 0
            $hasForbiddenCredentialName = $name -match '(?i)(TOKEN|SECRET|PASSWORD|PRIVATE_KEY|ACCESS_KEY|API_KEY)$'
            $hasForbiddenPrefix -or $hasForbiddenCredentialName -or $name -in @('CI', 'GH_TOKEN', 'SSH_AUTH_SOCK')
          })
          if ($inheritedSensitive.Count -ne 0) {
            exit 12
          }
          foreach ($ownedPath in @($UserHome, $UserTemp)) {
            $ownerSid = (Get-Acl -LiteralPath $ownedPath).GetOwner(
              [System.Security.Principal.SecurityIdentifier]
            ).Value
            if ($ownerSid -ne $tokenIdentity.User.Value) {
              exit 13
            }
          }
          [Environment]::SetEnvironmentVariable('HOME', $UserHome, 'Process')
          [Environment]::SetEnvironmentVariable('USERPROFILE', $UserHome, 'Process')
          [Environment]::SetEnvironmentVariable('TEMP', $UserTemp, 'Process')
          [Environment]::SetEnvironmentVariable('TMP', $UserTemp, 'Process')
          $buildVariables = Get-Content -LiteralPath $BuildEnvironment -Raw | ConvertFrom-Json
          foreach ($property in $buildVariables.PSObject.Properties) {
            if ($null -ne $property.Value) {
              [Environment]::SetEnvironmentVariable($property.Name, [string] $property.Value, 'Process')
            }
          }
          $env:PATH = "$ToolchainBin;$env:PATH"
          $env:CARGO_HOME = $CargoHome
          $env:CARGO_TARGET_DIR = Join-Path $SourceRoot 'target'
          $env:MINI_AGENT_LPAC_CARGO_INSTALL_EXE = Join-Path $CargoHome 'bin\mini-agent.exe'
          $env:MINI_AGENT_LPAC_PROTECTED_EXE = $ProtectedExe
          Set-Location $SourceRoot

          $installLog = Join-Path $EvidenceRoot 'install.raw'
          & $CargoExe install --locked --path . --debug --no-default-features --features js --root $CargoHome *> $installLog
          if ($LASTEXITCODE -ne 0) {
            exit 20
          }
          $installedBinary = Join-Path $CargoHome 'bin\mini-agent.exe'
          $statusText = & $installedBinary --print-config 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or -not $statusText) {
            exit 23
          }
          $requiredStatus = [ordered]@{
            compiled = '(?m)^  compiled[^\S\r\n]+true\r?$'
            backend = '(?m)^  backend[^\S\r\n]+windows-lpac\r?$'
            status = '(?m)^  status[^\S\r\n]+available\r?$'
            assurance = '(?m)^  assurance[^\S\r\n]+enforced\r?$'
            launch = '(?m)^  worker launch[^\S\r\n]+enabled with validated containment\r?$'
            processes = '(?m)^  native process limit[^\S\r\n]+1 worker process\r?$'
            memory = '(?m)^  native memory limit[^\S\r\n]+256 MiB\r?$'
            cpu = '(?m)^  native CPU limit[^\S\r\n]+35 seconds\r?$'
            spawn = '(?m)^  parent-brokered spawn[^\S\r\n]+disabled on Windows\r?$'
          }
          foreach ($entry in $requiredStatus.GetEnumerator()) {
            if ($statusText -notmatch $entry.Value) {
              exit 24
            }
          }
          $probeLog = Join-Path $EvidenceRoot 'probe.raw'
          & $CargoExe test --locked --no-default-features --features js windows_js_worker_containment -- --ignored --nocapture --test-threads=1 *> $probeLog
          if ($LASTEXITCODE -ne 0) {
            exit 21
          }
          $probeText = Get-Content -LiteralPath $probeLog -Raw
          $expected = 'WINDOWS_CONTAINMENT_PASS backend=lpac job_close=pass nested_parent_job=pass protocol=pass'
          if (-not $probeText.Contains($expected)) {
            exit 22
          }
          Remove-Item -LiteralPath $installLog, $probeLog -Force
          @{
            schema_version = 1
            platform = 'windows'
            account = 'separate-local-standard-user'
            administrator = $false
            environment = 'new-allowlisted-non-admin'
            install = 'cargo-debug-js'
            public_cached_status = 'available-enforced'
            containment_probe = 'passed'
            protected_control = 'system-owned-read-execute-only'
            raw_output = $false
          } | ConvertTo-Json -Depth 3 | Set-Content (Join-Path $EvidenceRoot 'phase6-standard-user-evidence.json')
          'PHASE6_STANDARD_USER platform=windows account=non-admin environment=allowlisted install=cargo-debug-js probe=passed raw_output=false' |
            Set-Content (Join-Path $EvidenceRoot 'phase6-standard-user-evidence.log')
          '@ | Set-Content -LiteralPath $probeScript -Encoding utf8

          function Quote-Argument([string] $Value) {
            return '"' + $Value.Replace('"', '\"') + '"'
          }
          $arguments = @(
            '-NoLogo',
            '-NoProfile',
            '-NonInteractive',
            '-ExecutionPolicy',
            'Bypass',
            '-File',
            (Quote-Argument $probeScript),
            '-CargoExe',
            (Quote-Argument $toolchainCargo),
            '-ToolchainBin',
            (Quote-Argument $toolchainBin),
            '-SourceRoot',
            (Quote-Argument $sourceRoot),
            '-CargoHome',
            (Quote-Argument $cargoHome),
            '-ProtectedExe',
            (Quote-Argument $protected),
            '-EvidenceRoot',
            (Quote-Argument $evidenceRoot),
            '-BuildEnvironment',
            (Quote-Argument $buildEnvironment),
            '-ExpectedAccount',
            (Quote-Argument "$env:COMPUTERNAME\$userName"),
            '-UserHome',
            (Quote-Argument $userHome),
            '-UserTemp',
            (Quote-Argument $userTemp)
          ) -join ' '
          $credential = [System.Management.Automation.PSCredential]::new("$env:COMPUTERNAME\$userName", $password)
          $process = Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList $arguments -Credential $credential -LoadUserProfile -UseNewEnvironment -WorkingDirectory $standardRoot -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "standard-user containment gate failed closed with exit code $($process.ExitCode)"
          }
          Copy-Item -LiteralPath (Join-Path $evidenceRoot 'phase6-standard-user-evidence.json') -Destination .
          Copy-Item -LiteralPath (Join-Path $evidenceRoot 'phase6-standard-user-evidence.log') -Destination .
          'PHASE6_STANDARD_USER=passed' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Phase 6 adversarial suites under js and skills
        shell: pwsh
        run: |
          $sharedSuites = @(
            'extras::js::tests::worker_protocol::',
            'extras::js::tests::worker_runtime::worker_runtime_',
            'extras::js::tests::worker_runtime::worker_supervisor_',
            'extras::js::tests::worker_broker::worker_broker_',
            'extras::js::tests::worker_broker::js_effect_audit_',
            'extras::js::tests::worker_fault_matrix::',
            'agent::builder::js_tests::unavailable_worker_containment_',
            'print::tests::config_reports_'
          )
          $skillsSuites = @(
            'extras::js::tests::skill_realm_isolation::',
            'extras::js::tests::capability_manifest_v2::',
            'extras::js::tests::worker_runtime::worker_runtime_verification_',
            'extras::js::tests::skill_held_out_evaluator::',
            'extras::js::tests::skill_admission_gate::'
          )
          foreach ($features in @('js', 'skills')) {
            foreach ($suite in $sharedSuites) {
              cargo test --locked --no-default-features --features $features $suite -- --test-threads=1
              if ($LASTEXITCODE -ne 0) {
                throw "$features adversarial suite $suite failed with exit code $LASTEXITCODE"
              }
            }
          }
          foreach ($suite in $skillsSuites) {
            cargo test --locked --no-default-features --features skills $suite -- --test-threads=1
            if ($LASTEXITCODE -ne 0) {
              throw "skills adversarial suite $suite failed with exit code $LASTEXITCODE"
            }
          }
          'PHASE6_ADVERSARIAL=passed' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify installed binary reports validated Windows containment
        shell: pwsh
        run: |
          & $env:MINI_AGENT_LPAC_CARGO_INSTALL_EXE --print-config 2>&1 | Tee-Object -FilePath windows-installed-print-config.txt
          if ($LASTEXITCODE -ne 0) {
            throw "installed --print-config failed with exit code $LASTEXITCODE"
          }
          if ((Get-Item -LiteralPath windows-installed-print-config.txt).Length -eq 0) {
            throw 'installed --print-config emitted no evidence'
          }
          $evidence = Get-Content -LiteralPath windows-installed-print-config.txt -Raw
          $required = [ordered]@{
            compiled = '(?m)^  compiled[^\S\r\n]+true\r?$'
            backend = '(?m)^  backend[^\S\r\n]+windows-lpac\r?$'
            status = '(?m)^  status[^\S\r\n]+available\r?$'
            assurance = '(?m)^  assurance[^\S\r\n]+enforced\r?$'
            launch = '(?m)^  worker launch[^\S\r\n]+enabled with validated containment\r?$'
            processes = '(?m)^  native process limit[^\S\r\n]+1 worker process\r?$'
            memory = '(?m)^  native memory limit[^\S\r\n]+256 MiB\r?$'
            cpu = '(?m)^  native CPU limit[^\S\r\n]+35 seconds\r?$'
            spawn = '(?m)^  parent-brokered spawn[^\S\r\n]+disabled on Windows\r?$'
          }
          foreach ($entry in $required.GetEnumerator()) {
            if ($evidence -notmatch $entry.Value) {
              throw "installed --print-config lacks validated Windows worker $($entry.Key) evidence"
            }
          }

      - name: Archive Windows containment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-worker-containment
          path: |
            windows-worker-containment.txt
            windows-installed-print-config.txt
          if-no-files-found: error

      - name: Write source-free Phase 6 gate evidence
        if: always()
        shell: pwsh
        run: |
          $probe = if ($env:PHASE6_REAL_PROBE) { $env:PHASE6_REAL_PROBE } else { 'not-run' }
          $adversarial = if ($env:PHASE6_ADVERSARIAL) { $env:PHASE6_ADVERSARIAL } else { 'not-run' }
          $standardUser = if ($env:PHASE6_STANDARD_USER) { $env:PHASE6_STANDARD_USER } else { 'not-run' }
          $resource = if ($env:PHASE6_RESOURCE) { $env:PHASE6_RESOURCE } else { 'not-run' }
          @{
            schema_version = 1
            platform = 'windows'
            runner = 'windows-latest'
            result = '${{ job.status }}'
            containment = @{
              backend = 'windows-lpac'
              assurance = 'enforced'
              real_probe = $probe
              standard_user_probe = $standardUser
              resource_measurement = $resource
              native_resource_gate = 'job-limits-probed'
            }
            adversarial = @{
              feature_rows = @('js', 'skills')
              suites = $adversarial
              zero_test_guard = 'enforced'
            }
            raw_output = $false
          } | ConvertTo-Json -Depth 4 | Set-Content 'phase6-gate-evidence.json'
          "PHASE6_GATE platform=windows result=${{ job.status }} probe=$probe suites=$adversarial raw_output=false" |
            Set-Content 'phase6-gate-evidence.log'

      - name: Archive source-free Phase 6 gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase6-worker-gate-windows
          path: |
            phase6-gate-evidence.json
            phase6-gate-evidence.log
            phase6-standard-user-evidence.json
            phase6-standard-user-evidence.log
          if-no-files-found: error

      - name: Remove the temporary Phase 6 standard-user account
        if: always()
        shell: pwsh
        run: |
          if (Get-LocalUser -Name 'phase6ci' -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name 'phase6ci'
          }

  phase6-cross-platform-gate:
    if: always() && github.event_name != 'schedule'
    needs:
      - linux-sandbox-policy
      - macos-worker-containment-gate
      - windows-worker-containment-gate
    runs-on: ubuntu-latest
    steps:
      - name: Require every Phase 6 platform gate
        shell: bash
        env:
          LINUX_RESULT: ${{ needs.linux-sandbox-policy.result }}
          MACOS_RESULT: ${{ needs.macos-worker-containment-gate.result }}
          WINDOWS_RESULT: ${{ needs.windows-worker-containment-gate.result }}
        run: |
          for result in "$LINUX_RESULT" "$MACOS_RESULT" "$WINDOWS_RESULT"; do
            if [ "$result" != 'success' ]; then
              echo 'A required Phase 6 platform gate did not succeed' >&2
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''

      - name: Download all Phase 6 worker resource records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: js-worker-resource-*
          path: ${{ runner.temp }}/js-worker-resources
          merge-multiple: true

      - name: Require one named resource record from every platform
        shell: bash
        run: |
          test -f "${RUNNER_TEMP}/js-worker-resources/js-worker-Linux.json"
          test -f "${RUNNER_TEMP}/js-worker-resources/js-worker-macOS.json"
          test -f "${RUNNER_TEMP}/js-worker-resources/js-worker-Windows.json"

      - name: Validate and aggregate the cross-platform worker resource baseline
        shell: bash
        run: |
          MINI_AGENT_JS_WORKER_BENCH_INPUTS="${RUNNER_TEMP}/js-worker-resources/js-worker-Linux.json:${RUNNER_TEMP}/js-worker-resources/js-worker-macOS.json:${RUNNER_TEMP}/js-worker-resources/js-worker-Windows.json" \
          MINI_AGENT_JS_WORKER_BENCH_OUTPUT="${RUNNER_TEMP}/js-worker-baseline.json" \
            cargo test --locked --no-default-features --features js \
              js_worker_resource_aggregate -- --ignored --nocapture

      - name: Archive the validated cross-platform worker resource baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: js-worker-resource-baseline
          path: ${{ runner.temp }}/js-worker-baseline.json
          if-no-files-found: error

  platform-paths:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        feature:
          - name: default
            args: ''
            mcp: true
          - name: mcp
            args: '--no-default-features --features mcp'
            mcp: true
          - name: js
            args: '--no-default-features --features js'
            mcp: false
          - name: mcp-js
            args: '--no-default-features --features mcp,js'
            mcp: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the durable macOS temporary root
        if: matrix.os == 'macos-latest'
        shell: bash
        run: echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Test deterministic and real platform path acceptance
        shell: bash
        run: cargo test --locked ${{ matrix.feature.args }} platform_paths_acceptance

      - name: Test resolver and artifact-owner contract
        shell: bash
        run: |
          cargo test --locked ${{ matrix.feature.args }} app_paths_matrix
          cargo test --locked ${{ matrix.feature.args }} persistent_artifact_ownership

      - name: Test migration and portable filename contract
        shell: bash
        run: |
          cargo test --locked ${{ matrix.feature.args }} legacy_path_migration
          cargo test --locked ${{ matrix.feature.args }} portable_filename_policy
          cargo test --locked ${{ matrix.feature.args }} path_containment

      - name: Test config and session private storage
        shell: bash
        run: |
          cargo test --locked ${{ matrix.feature.args }} config_persistence_permissions
          cargo test --locked ${{ matrix.feature.args }} session_storage_permissions

      - name: Test MCP OAuth credential storage
        if: matrix.feature.mcp
        shell: bash
        run: |
          cargo test --locked ${{ matrix.feature.args }} mcp_oauth_identity
          cargo test --locked ${{ matrix.feature.args }} mcp_oauth_migration
          cargo test --locked ${{ matrix.feature.args }} mcp_oauth_storage_security

      - name: Write machine-readable platform result
        if: always()
        shell: pwsh
        run: |
          @{
            platform = '${{ matrix.os }}'
            feature = '${{ matrix.feature.name }}'
            result = '${{ job.status }}'
            assertions = @(
              'roots',
              'owners',
              'migration',
              'portable-filenames',
              'link-or-reparse-containment',
              'config-private-storage',
              'session-private-storage',
              'oauth-private-storage-when-enabled'
            )
          } | ConvertTo-Json -Depth 3 | Set-Content 'platform-path-result.json'

      - name: Archive platform result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-paths-${{ matrix.os }}-${{ matrix.feature.name }}
          path: platform-path-result.json
          if-no-files-found: error

  platform-path-negative-controls:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Prove intentional contract mutations fail
        shell: bash
        run: |
          for control in \
            config-to-data \
            windows-local-to-roaming \
            credential-acl-broad-read \
            session-acl-broad-read \
            migration-silent-conflict \
            reserved-name-accepted
          do
            if ZS_PLATFORM_PATH_NEGATIVE_CONTROL="$control" \
              cargo test --locked platform_paths_acceptance_intentional_negative_controls
            then
              echo "negative control unexpectedly passed: $control" >&2
              exit 1
            fi
          done

      - name: Write machine-readable negative-control result
        if: always()
        shell: pwsh
        run: |
          @{
            result = '${{ job.status }}'
            controls = @(
              'config-to-data',
              'windows-local-to-roaming',
              'credential-acl-broad-read',
              'session-acl-broad-read',
              'migration-silent-conflict',
              'reserved-name-accepted'
            )
          } | ConvertTo-Json -Depth 3 | Set-Content 'platform-path-negative-controls.json'

      - name: Archive negative-control result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-path-negative-controls
          path: platform-path-negative-controls.json
          if-no-files-found: error

  platform-path-install-smoke:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the durable macOS temporary root
        if: matrix.os == 'macos-latest'
        shell: bash
        run: echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Test Windows URL opener boundary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: cargo test --locked windows_open_request

      - name: Install debug binary into a clean root
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'zerostack-platform-install'
          cargo install --locked --path . --debug --root $installRoot

      - name: Verify installed binary reports and uses isolated roots
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ('zerostack-path-smoke-' + [guid]::NewGuid())
          $workspace = Join-Path $smokeRoot 'workspace'
          $cleanHome = Join-Path $smokeRoot 'home'
          New-Item -ItemType Directory -Path $workspace | Out-Null
          New-Item -ItemType Directory -Path $cleanHome | Out-Null

          $env:HOME = $cleanHome
          if ($IsWindows) {
            $env:USERPROFILE = $cleanHome
          }

          $env:ZS_CONFIG_DIR = Join-Path $smokeRoot 'config'
          $env:ZS_DATA_DIR = Join-Path $smokeRoot 'data'
          $env:ZS_LOCAL_DATA_DIR = Join-Path $smokeRoot 'local-data'
          $env:ZS_STATE_DIR = Join-Path $smokeRoot 'state'
          $env:ZS_CACHE_DIR = Join-Path $smokeRoot 'cache'
          $env:ZS_CREDENTIALS_DIR = Join-Path $smokeRoot 'credentials'

          $binaryName = if ($IsWindows) { 'mini-agent.exe' } else { 'mini-agent' }
          $binary = Join-Path (Join-Path $env:RUNNER_TEMP 'zerostack-platform-install/bin') $binaryName
          Push-Location $workspace
          try {
            $output = & $binary --print-config 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "installed binary failed: $($output -join [Environment]::NewLine)"
            }
          } finally {
            Pop-Location
          }
          $text = $output -join [Environment]::NewLine
          $roots = @{
            config = $env:ZS_CONFIG_DIR
            data = $env:ZS_DATA_DIR
            local_data = $env:ZS_LOCAL_DATA_DIR
            state = $env:ZS_STATE_DIR
            cache = $env:ZS_CACHE_DIR
            credentials = $env:ZS_CREDENTIALS_DIR
          }
          foreach ($entry in $roots.GetEnumerator()) {
            if (-not (Test-Path -PathType Container $entry.Value)) {
              throw "installed binary did not create $($entry.Key) root: $($entry.Value)"
            }
            if (-not $text.Contains($entry.Value)) {
              throw "installed binary did not report $($entry.Key) root: $($entry.Value)"
            }
          }
          if (Test-Path (Join-Path $workspace '.zerostack')) {
            throw 'installed binary wrote persistent state into its working directory'
          }
          @{
            platform = '${{ matrix.os }}'
            result = 'success'
            binary = $binary
            workspace = $workspace
            roots = $roots
          } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'platform-path-install-smoke.json')

      - name: Ensure machine-readable install-smoke result
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path 'platform-path-install-smoke.json')) {
            @{
              platform = '${{ matrix.os }}'
              result = '${{ job.status }}'
            } | ConvertTo-Json | Set-Content 'platform-path-install-smoke.json'
          }

      - name: Archive install-smoke result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-path-install-smoke-${{ matrix.os }}
          path: platform-path-install-smoke.json
          if-no-files-found: error

  mcp-stdio:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the durable macOS temporary root
        if: matrix.os == 'macos-latest'
        shell: bash
        run: echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Test MCP stdio config wiring
        run: cargo test --locked --no-default-features --features mcp mcp_stdio_config

      - name: Test MCP stdio end to end
        run: cargo test --locked --no-default-features --features mcp mcp_stdio_end_to_end

      - name: Test MCP stdio failure cleanup
        run: cargo test --locked --no-default-features --features mcp mcp_stdio_failure_cleanup

  install:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the durable macOS temporary root
        if: matrix.os == 'macos-latest'
        shell: bash
        run: echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install locally (debug)
        run: cargo install --locked --path . --debug

  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Package crate
        run: cargo package --locked

      - name: Verify packaged crate builds and installs in isolation
        run: |
          crate=$(ls target/package/mini-agent-*.crate | tail -1)
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          tar xzf "$crate" -C "$tmpdir"
          pkgdir=$(ls -d "$tmpdir"/mini-agent-*)
          cargo install --locked --path "$pkgdir" --debug --root "$tmpdir/install"
          "$tmpdir/install/bin/mini-agent" --version | grep -Fq "mini-agent "

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Test dependency policy failure cases
        run: python3 scripts/tests/test_check_dependency_policy.py

      - name: Validate dependency policy and exceptions
        run: python3 scripts/check_dependency_policy.py

      - name: Verify the committed lockfile resolves
        run: cargo metadata --locked --all-features --format-version 1 > /dev/null

      - name: Install dependency policy tools
        run: |
          cargo install --locked cargo-audit --version 0.22.1
          cargo install --locked cargo-deny --version 0.19.4

      - name: Audit the committed lockfile
        run: cargo audit --file Cargo.lock

      - name: Check licenses, sources, and versions
        run: cargo deny --locked check bans licenses sources

      - name: Check fresh advisories and yanks
        run: cargo deny check advisories

      - name: Reject lockfile changes made by policy tooling
        run: git diff --exit-code -- Cargo.lock

name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Check formatting
        run: cargo fmt --check

      - name: Test loop lifecycle
        run: python3 -m unittest scripts.tests.test_loop_lifecycle

      - name: Test Cargo feature graph gate
        run: python3 -m unittest scripts.tests.test_check_feature_graph

      - name: Test release workflow policy
        run: python3 -m unittest scripts.tests.test_check_package_metadata

      - name: Verify release workflow policy
        run: python3 scripts/check-package-metadata.py

      - name: Verify Cargo feature graph
        run: python3 scripts/check_feature_graph.py

  clippy:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # Explicit supported rows rather than --all-features. The isolated memory
        # and sandbox rows catch missing cfg gates that the default row can mask.
        # --all-features would enable `skills-embed`, pulling ort-sys (ONNX
        # Runtime), which has no prebuilt binaries for some hosts and adds a
        # large native download to every run. That backend is exercised by the
        # optional job below.
        features:
          - ""
          - "--no-default-features"
          - "--no-default-features --features memory"
          - "--no-default-features --features sandbox"
          - "--no-default-features --features js,skills"
          - "--no-default-features --features mcp,js,sandbox,skills,memory"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Run Clippy (${{ matrix.features }})
        run: cargo clippy --locked ${{ matrix.features }} -- -D warnings

  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The documented supported feature combinations. Isolated memory and
        # sandbox rows catch missing cfg gates that default features can mask.
        # `skills` implies `js`, so a skills-without-JS state is unselectable by
        # construction.
        features:
          - ""
          - "--no-default-features"
          - "--no-default-features --features memory"
          - "--no-default-features --features js"
          - "--no-default-features --features sandbox"
          - "--no-default-features --features skills"
          - "--no-default-features --features js,sandbox"
          - "--no-default-features --features mcp"
          - "--no-default-features --features js,skills"
          - "--no-default-features --features mcp,js,sandbox,skills,memory"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Test (${{ matrix.features }})
        run: cargo test --locked ${{ matrix.features }}

      - name: Validate deterministic skill retrieval benchmark metrics
        if: matrix.os == 'ubuntu-latest' && matrix.features == '--no-default-features --features js,skills'
        run: cargo test --locked --no-default-features --features js,skills skill_retrieval_benchmark_smoke -- --nocapture

      - name: Compile the full Phase 5 operations audit
        if: matrix.os == 'ubuntu-latest' && matrix.features == '--no-default-features --features js,skills'
        run: cargo test --locked --no-default-features --features js,skills phase5_operations_benchmark

  # The local ONNX/BGE embedding backend. Kept out of the required matrix because
  # ort-sys ships no prebuilt binaries for every host (notably x86_64-apple-darwin)
  # and downloading the runtime makes the job slow and network-dependent. Failure
  # here signals that `skills-embed` needs attention; it does not block the build.
  skills-embed-optional:
    if: github.event_name != 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Test (--no-default-features --features skills-embed)
        run: cargo test --locked --no-default-features --features skills-embed

  linux-sandbox-policy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Test Linux sandbox capability policy
        run: cargo test --locked linux_sandbox_policy

      - name: Test shared sandbox module
        # Keep the trailing Rust module separator inside a YAML block scalar.
        run: >-
          cargo test --locked sandbox::

      - name: Test JS spawn parity through the shared sandbox
        run: cargo test --locked --features js,sandbox

  platform-paths:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        feature:
          - name: default
            args: ''
            mcp: true
          - name: mcp
            args: '--no-default-features --features mcp'
            mcp: true
          - name: js
            args: '--no-default-features --features js'
            mcp: false
          - name: mcp-js
            args: '--no-default-features --features mcp,js'
            mcp: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Test deterministic and real platform path acceptance
        shell: bash
        run: cargo test --locked ${{ matrix.feature.args }} platform_paths_acceptance

      - name: Test resolver and artifact-owner contract
        shell: bash
        run: |
          cargo test --locked ${{ matrix.feature.args }} app_paths_matrix
          cargo test --locked ${{ matrix.feature.args }} persistent_artifact_ownership

      - name: Test migration and portable filename contract
        shell: bash
        run: |
          cargo test --locked ${{ matrix.feature.args }} legacy_path_migration
          cargo test --locked ${{ matrix.feature.args }} portable_filename_policy
          cargo test --locked ${{ matrix.feature.args }} path_containment

      - name: Test config and session private storage
        shell: bash
        run: |
          cargo test --locked ${{ matrix.feature.args }} config_persistence_permissions
          cargo test --locked ${{ matrix.feature.args }} session_storage_permissions

      - name: Test MCP OAuth credential storage
        if: matrix.feature.mcp
        shell: bash
        run: |
          cargo test --locked ${{ matrix.feature.args }} mcp_oauth_identity
          cargo test --locked ${{ matrix.feature.args }} mcp_oauth_migration
          cargo test --locked ${{ matrix.feature.args }} mcp_oauth_storage_security

      - name: Write machine-readable platform result
        if: always()
        shell: pwsh
        run: |
          @{
            platform = '${{ matrix.os }}'
            feature = '${{ matrix.feature.name }}'
            result = '${{ job.status }}'
            assertions = @(
              'roots',
              'owners',
              'migration',
              'portable-filenames',
              'link-or-reparse-containment',
              'config-private-storage',
              'session-private-storage',
              'oauth-private-storage-when-enabled'
            )
          } | ConvertTo-Json -Depth 3 | Set-Content 'platform-path-result.json'

      - name: Archive platform result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-paths-${{ matrix.os }}-${{ matrix.feature.name }}
          path: platform-path-result.json
          if-no-files-found: error

  platform-path-negative-controls:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Prove intentional contract mutations fail
        shell: bash
        run: |
          for control in \
            config-to-data \
            windows-local-to-roaming \
            credential-acl-broad-read \
            session-acl-broad-read \
            migration-silent-conflict \
            reserved-name-accepted
          do
            if ZS_PLATFORM_PATH_NEGATIVE_CONTROL="$control" \
              cargo test --locked platform_paths_acceptance_intentional_negative_controls
            then
              echo "negative control unexpectedly passed: $control" >&2
              exit 1
            fi
          done

      - name: Write machine-readable negative-control result
        if: always()
        shell: pwsh
        run: |
          @{
            result = '${{ job.status }}'
            controls = @(
              'config-to-data',
              'windows-local-to-roaming',
              'credential-acl-broad-read',
              'session-acl-broad-read',
              'migration-silent-conflict',
              'reserved-name-accepted'
            )
          } | ConvertTo-Json -Depth 3 | Set-Content 'platform-path-negative-controls.json'

      - name: Archive negative-control result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-path-negative-controls
          path: platform-path-negative-controls.json
          if-no-files-found: error

  platform-path-install-smoke:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Test Windows URL opener boundary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: cargo test --locked windows_open_request

      - name: Install debug binary into a clean root
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'zerostack-platform-install'
          cargo install --locked --path . --debug --root $installRoot

      - name: Verify installed binary reports and uses isolated roots
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ('zerostack-path-smoke-' + [guid]::NewGuid())
          $workspace = Join-Path $smokeRoot 'workspace'
          $cleanHome = Join-Path $smokeRoot 'home'
          New-Item -ItemType Directory -Path $workspace | Out-Null
          New-Item -ItemType Directory -Path $cleanHome | Out-Null

          $env:HOME = $cleanHome
          if ($IsWindows) {
            $env:USERPROFILE = $cleanHome
          }

          $env:ZS_CONFIG_DIR = Join-Path $smokeRoot 'config'
          $env:ZS_DATA_DIR = Join-Path $smokeRoot 'data'
          $env:ZS_LOCAL_DATA_DIR = Join-Path $smokeRoot 'local-data'
          $env:ZS_STATE_DIR = Join-Path $smokeRoot 'state'
          $env:ZS_CACHE_DIR = Join-Path $smokeRoot 'cache'
          $env:ZS_CREDENTIALS_DIR = Join-Path $smokeRoot 'credentials'

          $binaryName = if ($IsWindows) { 'mini-agent.exe' } else { 'mini-agent' }
          $binary = Join-Path (Join-Path $env:RUNNER_TEMP 'zerostack-platform-install/bin') $binaryName
          Push-Location $workspace
          try {
            $output = & $binary --print-config 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "installed binary failed: $($output -join [Environment]::NewLine)"
            }
          } finally {
            Pop-Location
          }
          $text = $output -join [Environment]::NewLine
          $roots = @{
            config = $env:ZS_CONFIG_DIR
            data = $env:ZS_DATA_DIR
            local_data = $env:ZS_LOCAL_DATA_DIR
            state = $env:ZS_STATE_DIR
            cache = $env:ZS_CACHE_DIR
            credentials = $env:ZS_CREDENTIALS_DIR
          }
          foreach ($entry in $roots.GetEnumerator()) {
            if (-not (Test-Path -PathType Container $entry.Value)) {
              throw "installed binary did not create $($entry.Key) root: $($entry.Value)"
            }
            if (-not $text.Contains($entry.Value)) {
              throw "installed binary did not report $($entry.Key) root: $($entry.Value)"
            }
          }
          if (Test-Path (Join-Path $workspace '.zerostack')) {
            throw 'installed binary wrote persistent state into its working directory'
          }
          @{
            platform = '${{ matrix.os }}'
            result = 'success'
            binary = $binary
            workspace = $workspace
            roots = $roots
          } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'platform-path-install-smoke.json')

      - name: Ensure machine-readable install-smoke result
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path 'platform-path-install-smoke.json')) {
            @{
              platform = '${{ matrix.os }}'
              result = '${{ job.status }}'
            } | ConvertTo-Json | Set-Content 'platform-path-install-smoke.json'
          }

      - name: Archive install-smoke result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-path-install-smoke-${{ matrix.os }}
          path: platform-path-install-smoke.json
          if-no-files-found: error

  mcp-stdio:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Test MCP stdio config wiring
        run: cargo test --locked --no-default-features --features mcp mcp_stdio_config

      - name: Test MCP stdio end to end
        run: cargo test --locked --no-default-features --features mcp mcp_stdio_end_to_end

      - name: Test MCP stdio failure cleanup
        run: cargo test --locked --no-default-features --features mcp mcp_stdio_failure_cleanup

  install:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install locally (debug)
        run: cargo install --locked --path . --debug

  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Package crate
        run: cargo package --locked

      - name: Verify packaged crate builds and installs in isolation
        run: |
          crate=$(ls target/package/mini-agent-*.crate | tail -1)
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          tar xzf "$crate" -C "$tmpdir"
          pkgdir=$(ls -d "$tmpdir"/mini-agent-*)
          cargo install --locked --path "$pkgdir" --debug --root "$tmpdir/install"
          "$tmpdir/install/bin/mini-agent" --version | grep -Fq "mini-agent "

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Test dependency policy failure cases
        run: python3 scripts/tests/test_check_dependency_policy.py

      - name: Validate dependency policy and exceptions
        run: python3 scripts/check_dependency_policy.py

      - name: Verify the committed lockfile resolves
        run: cargo metadata --locked --all-features --format-version 1 > /dev/null

      - name: Install dependency policy tools
        run: |
          cargo install --locked cargo-audit --version 0.22.1
          cargo install --locked cargo-deny --version 0.19.4

      - name: Audit the committed lockfile
        run: cargo audit --file Cargo.lock

      - name: Check licenses, sources, and versions
        run: cargo deny --locked check bans licenses sources

      - name: Check fresh advisories and yanks
        run: cargo deny check advisories

      - name: Reject lockfile changes made by policy tooling
        run: git diff --exit-code -- Cargo.lock

name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTFLAGS: ''
concurrency:
  group: native-linux-profile100-rustup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-sandbox-policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0a2e280c0fcfb0b0bbe0e6e11b5d40517f492de3
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '0a2e280c0fcfb0b0bbe0e6e11b5d40517f492de3'
          mkdir -p target/native-workspace-evidence
          git rev-parse HEAD > target/native-workspace-evidence/source.txt
          git diff --exit-code
          test "$(git rev-parse HEAD^)" = '1c3a99d691ad6c41041819b2a9f71e6e3a4182f6'
          printf '%s  %s\n' 'f20b6d3fe6b72a4d002a050cedbd2f98a149e2f4f43bdbdb282247e00d70da73' 'tests/headless_json.rs' | sha256sum -c -
          printf '%s  %s\n' '874ad15d5dc42400a3dac285c6da77fa3c55250f50cc24ae46bd5efa2cf56dc0' 'src/sandbox.rs' | sha256sum -c -
          printf '%s  %s\n' '4e0c172dd448ab284f4aba09d7b67870cc0a9dc0d6499af1c13de014e3f20f2b' 'src/sandbox/general_profile.rs' | sha256sum -c -

      - name: Prepare guarded Git runtime
        uses: ./.github/actions/prepare-git-runtime

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          # Native proc-macro libraries must not restore from Ubuntu 24 caches.
          cache-key: ubuntu-22.04

      - name: Install bubblewrap
        run: bash scripts/install-ci-bubblewrap.sh --pinned-native

      - name: Record unchanged host namespace policy
        shell: bash
        run: |
          uname -r
          # Report, never disable or relax host policy. Real probes below fail
          # closed if this runner cannot support the delivered boundaries.
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true

      - name: Test only installed HOME Rustup native profile case
        shell: bash
        run: |
          set -euo pipefail
          evidence=target/native-workspace-evidence
          cargo test --locked --bin mini-agent profile100_native -- --list > "$evidence/profile100-list.txt"
          test "$(grep -c ': test$' "$evidence/profile100-list.txt")" -eq 2
          for name in \
            'sandbox::general_profile::tests::profile100_native_host_profiles_preserve_masks_and_real_operations' \
            'sandbox::general_profile::tests::profile100_native_host_read_runs_cargo_test_from_home_rustup'; do
            test "$(grep -Fxc "$name: test" "$evidence/profile100-list.txt")" -eq 1
          done
          name='sandbox::general_profile::tests::profile100_native_host_read_runs_cargo_test_from_home_rustup'
          log="$evidence/${name//::/_}.log"
          cargo test --locked --bin mini-agent "$name" \
            -- --exact --ignored --nocapture --test-threads=1 2>&1 | tee "$log"
          grep -F 'test result: ok. 1 passed;' "$log"

      - name: Archive native Linux workspace proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-profile100-rustup-followup
          path: target/native-workspace-evidence
          if-no-files-found: error

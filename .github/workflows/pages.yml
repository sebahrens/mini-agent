name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/agent/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Convert markdown to HTML
        # The published site is the agent documentation tree under docs/agent
        # (plus docs/agent/providers). Specs, plans, and benchmarks stay
        # repository-only.
        run: |
          set -euo pipefail
          cd docs/agent
          test -f template.html
          # Internal .md links must point at the built .html pages.
          sed -i -e 's/\.md#/.html#/g' -e 's/\.md)/.html)/g' -- *.md providers/*.md
          {
            echo '# mini-agent documentation'
            echo
            for md in *.md providers/*.md; do
              name="${md%.md}"
              title="$(grep -m1 '^# ' "$md" | sed 's/^# //')"
              [ -n "$title" ] || title="$name"
              echo "- [${title}](${name}.html)"
            done
          } > index.md
          for md in *.md providers/*.md; do
            name="${md%.md}"
            title="$(grep -m1 '^# ' "$md" | sed 's/^# //')"
            [ -n "$title" ] || title="$name"
            pandoc "$md" \
              --template=template.html \
              --wrap=none \
              --metadata title="$title" \
              --metadata pagetitle="$title — mini-agent" \
              --metadata name="$name" \
              -o "${name}.html"
          done

      - name: Generate sitemap.xml and robots.txt
        run: |
          set -euo pipefail
          cd docs/agent
          base="https://sebahrens.github.io/mini-agent"
          today="$(date +%F)"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            find . -name '*.html' ! -name 'template.html' | sort | while read -r html; do
              path="${html#./}"
              loc="$base/$path"
              [ "$path" = "index.html" ] && loc="$base/"
              printf '  <url><loc>%s</loc><lastmod>%s</lastmod></url>\n' "$loc" "$today"
            done
            echo '</urlset>'
          } > sitemap.xml
          printf 'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' "$base" > robots.txt

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/agent

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

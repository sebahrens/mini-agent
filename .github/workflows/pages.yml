name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/agent/**'
      - 'docs/vscode-acp-setup.md'
      - 'scripts/build_docs_site.py'
      - 'src/config/keys.rs'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build the site (pages, sidebar, search index, config-key reference)
        # The published site is the agent documentation tree under docs/agent (plus
        # docs/agent/providers and docs/vscode-acp-setup.md), listed in order in
        # docs/agent/manifest.txt. The script fails the build when a manifest entry has
        # no file, a page is missing from the manifest, a src/config/keys.rs key is
        # missing from the generated reference, or an internal link is broken. Specs,
        # plans, and benchmarks stay repository-only.
        run: |
          set -euo pipefail
          python3 scripts/build_docs_site.py --out site

      - name: Generate sitemap.xml and robots.txt
        run: |
          set -euo pipefail
          cd site
          base="https://sebahrens.github.io/mini-agent"
          today="$(date +%F)"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            find . -name '*.html' ! -name 'template.html' | sort | while read -r html; do
              path="${html#./}"
              loc="$base/$path"
              [ "$path" = "index.html" ] && loc="$base/"
              printf '  <url><loc>%s</loc><lastmod>%s</lastmod></url>\n' "$loc" "$today"
            done
            echo '</urlset>'
          } > sitemap.xml
          printf 'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' "$base" > robots.txt

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

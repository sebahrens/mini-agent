name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CANONICAL_BINARY: mini-agent
  # setup-rust-toolchain otherwise injects -D warnings into release builds.
  RUSTFLAGS: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-metadata:
    runs-on: ubuntu-latest
    outputs:
      # The single source of the VSIX and SBOM version for every later job.
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.96.0"

      - name: Validate Cargo and package metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check-package-metadata.py \
            --ref-type "$RELEASE_REF_TYPE" \
            --release-tag "$RELEASE_TAG"

      - name: Read the release version from Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "ERROR: Cargo.toml has no package version" >&2
            exit 1
          fi
          extension_version=$(sed -n 's/^  "version": "\([^"]*\)",$/\1/p' editors/vscode/package.json | head -1)
          if [ "$extension_version" != "$version" ]; then
            echo "ERROR: editors/vscode/package.json version $extension_version != Cargo $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: package-metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.96.0"
          target: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package and smoke binary
        run: |
          archive="${CANONICAL_BINARY}-${{ matrix.target }}.tar.gz"
          python3 scripts/package-release-binary.py \
            --binary "target/${{ matrix.target }}/release/$CANONICAL_BINARY" \
            --archive "$archive" \
            --executable-name "$CANONICAL_BINARY"
          smoke_dir="$(mktemp -d)"
          tar xzf "$archive" -C "$smoke_dir"
          "$smoke_dir/$CANONICAL_BINARY" --version | grep -Fq -- "$CANONICAL_BINARY "
          rm -rf "$smoke_dir"

      - name: Build lite
        run: cargo build --locked --release --no-default-features --target ${{ matrix.target }}

      - name: Package and smoke lite binary
        run: |
          archive="${CANONICAL_BINARY}-lite-${{ matrix.target }}.tar.gz"
          python3 scripts/package-release-binary.py \
            --binary "target/${{ matrix.target }}/release/$CANONICAL_BINARY" \
            --archive "$archive" \
            --executable-name "$CANONICAL_BINARY"
          smoke_dir="$(mktemp -d)"
          tar xzf "$archive" -C "$smoke_dir"
          "$smoke_dir/$CANONICAL_BINARY" --version | grep -Fq -- "$CANONICAL_BINARY "
          rm -rf "$smoke_dir"

      - name: Upload archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archives-${{ matrix.target }}
          path: |
            ${{ env.CANONICAL_BINARY }}-${{ matrix.target }}.tar.gz
            ${{ env.CANONICAL_BINARY }}-lite-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-static:
    name: ${{ matrix.target }}-static
    needs: package-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.96.0"

      - name: Install cross
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cross@0.2.5

      - name: Build static binary (${{ matrix.target }})
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Package and validate
        run: |
          archive="${CANONICAL_BINARY}-${{ matrix.target }}.tar.gz"
          python3 scripts/package-release-binary.py \
            --binary "target/${{ matrix.target }}/release/$CANONICAL_BINARY" \
            --archive "$archive" \
            --executable-name "$CANONICAL_BINARY"
          smoke_dir="$(mktemp -d)"
          tar xzf "$archive" -C "$smoke_dir"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            file "$smoke_dir/$CANONICAL_BINARY" | grep -Fq -- "ARM aarch64"
            readelf -l "$smoke_dir/$CANONICAL_BINARY" > "$smoke_dir/program-headers"
            if grep -Fq -- "INTERP" "$smoke_dir/program-headers"; then
              echo "ERROR: ARM64 musl artifact is dynamically linked"
              exit 1
            fi
          else
            "$smoke_dir/$CANONICAL_BINARY" --version | grep -Fq -- "$CANONICAL_BINARY "
          fi
          rm -rf "$smoke_dir"

      - name: Build static lite binary (${{ matrix.target }})
        run: cross build --locked --release --no-default-features --target ${{ matrix.target }}

      - name: Package and validate lite
        run: |
          archive="${CANONICAL_BINARY}-lite-${{ matrix.target }}.tar.gz"
          python3 scripts/package-release-binary.py \
            --binary "target/${{ matrix.target }}/release/$CANONICAL_BINARY" \
            --archive "$archive" \
            --executable-name "$CANONICAL_BINARY"
          smoke_dir="$(mktemp -d)"
          tar xzf "$archive" -C "$smoke_dir"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            file "$smoke_dir/$CANONICAL_BINARY" | grep -Fq -- "ARM aarch64"
            readelf -l "$smoke_dir/$CANONICAL_BINARY" > "$smoke_dir/program-headers"
            if grep -Fq -- "INTERP" "$smoke_dir/program-headers"; then
              echo "ERROR: ARM64 musl artifact is dynamically linked"
              exit 1
            fi
          else
            "$smoke_dir/$CANONICAL_BINARY" --version | grep -Fq -- "$CANONICAL_BINARY "
          fi
          rm -rf "$smoke_dir"

      - name: Upload archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archives-${{ matrix.target }}
          path: |
            ${{ env.CANONICAL_BINARY }}-${{ matrix.target }}.tar.gz
            ${{ env.CANONICAL_BINARY }}-lite-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: ${{ matrix.target }}
    needs: package-metadata
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.96.0"
          target: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package and smoke binary
        run: |
          archive="${CANONICAL_BINARY}-${{ matrix.target }}.tar.gz"
          python3 scripts/package-release-binary.py \
            --binary "target/${{ matrix.target }}/release/${CANONICAL_BINARY}.exe" \
            --archive "$archive" \
            --executable-name "${CANONICAL_BINARY}.exe"
          smoke_dir="$(mktemp -d)"
          tar xzf "$archive" -C "$smoke_dir"
          "$smoke_dir/${CANONICAL_BINARY}.exe" --version | grep -Fq -- "$CANONICAL_BINARY "
          rm -rf "$smoke_dir"

      - name: Build lite
        run: cargo build --locked --release --no-default-features --target ${{ matrix.target }}

      - name: Package and smoke lite binary
        run: |
          archive="${CANONICAL_BINARY}-lite-${{ matrix.target }}.tar.gz"
          python3 scripts/package-release-binary.py \
            --binary "target/${{ matrix.target }}/release/${CANONICAL_BINARY}.exe" \
            --archive "$archive" \
            --executable-name "${CANONICAL_BINARY}.exe"
          smoke_dir="$(mktemp -d)"
          tar xzf "$archive" -C "$smoke_dir"
          "$smoke_dir/${CANONICAL_BINARY}.exe" --version | grep -Fq -- "$CANONICAL_BINARY "
          rm -rf "$smoke_dir"

      - name: Upload archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archives-${{ matrix.target }}
          path: |
            ${{ env.CANONICAL_BINARY }}-${{ matrix.target }}.tar.gz
            ${{ env.CANONICAL_BINARY }}-lite-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  corresponding-source:
    name: Corresponding Source
    needs: package-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.96.0"

      - name: Assemble and validate Corresponding Source
        run: bash scripts/package-corresponding-source.sh "$GITHUB_REF_NAME" . HEAD

      - name: Upload Corresponding Source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corresponding-source
          path: ${{ env.CANONICAL_BINARY }}-${{ github.ref_name }}-source.tar.gz
          if-no-files-found: error
          retention-days: 1

  checksums:
    name: SHA256SUMS
    needs: [build, build-static, build-windows, corresponding-source]
    runs-on: ubuntu-latest
    steps:
      - name: Download all archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: archives-*
          merge-multiple: true

      - name: Download Corresponding Source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: corresponding-source

      - name: Verify expected archive set
        run: |
          expected=(
            mini-agent-x86_64-unknown-linux-gnu.tar.gz
            mini-agent-aarch64-unknown-linux-gnu.tar.gz
            mini-agent-x86_64-apple-darwin.tar.gz
            mini-agent-aarch64-apple-darwin.tar.gz
            mini-agent-x86_64-unknown-linux-musl.tar.gz
            mini-agent-aarch64-unknown-linux-musl.tar.gz
            mini-agent-x86_64-pc-windows-msvc.tar.gz
            mini-agent-lite-x86_64-unknown-linux-gnu.tar.gz
            mini-agent-lite-aarch64-unknown-linux-gnu.tar.gz
            mini-agent-lite-x86_64-apple-darwin.tar.gz
            mini-agent-lite-aarch64-apple-darwin.tar.gz
            mini-agent-lite-x86_64-unknown-linux-musl.tar.gz
            mini-agent-lite-aarch64-unknown-linux-musl.tar.gz
            mini-agent-lite-x86_64-pc-windows-msvc.tar.gz
            mini-agent-${GITHUB_REF_NAME}-source.tar.gz
          )
          found=$(ls *.tar.gz | sort)
          expected_sorted=$(printf '%s\n' "${expected[@]}" | sort)
          if [ "$found" != "$expected_sorted" ]; then
            echo "ERROR: Archive set mismatch"
            echo "Expected:"
            echo "$expected_sorted"
            echo "Found:"
            echo "$found"
            exit 1
          fi

      - name: Generate SHA256SUMS
        run: sha256sum *.tar.gz | sort > SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  vscode-vsix:
    name: VSIX ${{ matrix.vscode-target }}
    needs: [package-metadata, build, build-windows]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.package-metadata.outputs.version }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            vscode-target: linux-x64
          - os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            vscode-target: linux-arm64
          - os: macos-15-intel
            rust-target: x86_64-apple-darwin
            vscode-target: darwin-x64
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            vscode-target: darwin-arm64
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            vscode-target: win32-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: editors/vscode/.nvmrc
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Verify pinned npm
        run: test "$(npm --version)" = "10.8.2"

      - name: Download native release binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: archives-${{ matrix.rust-target }}
          path: release-input

      - name: Populate matching extension binary
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
          VSCODE_TARGET: ${{ matrix.vscode-target }}
        run: |
          mkdir -p "editors/vscode/bin/$VSCODE_TARGET"
          tar -xzf "release-input/mini-agent-$RUST_TARGET.tar.gz" \
            -C "editors/vscode/bin/$VSCODE_TARGET"

      - name: Install locked extension dependencies
        working-directory: editors/vscode
        run: npm ci --no-audit --no-fund

      - name: Test and package candidate
        working-directory: editors/vscode
        env:
          VSCODE_TARGET: ${{ matrix.vscode-target }}
        run: |
          npm run typecheck
          npm run lint
          npm test
          node scripts/package-target.mjs "$VSCODE_TARGET"
          npm run sbom
          mv dist/mini-agent-vscode.cdx.json \
            "dist/mini-agent-$RELEASE_VERSION-$VSCODE_TARGET.cdx.json"

      - name: Install candidate into clean VS Code
        working-directory: editors/vscode
        env:
          VSCODE_TARGET: ${{ matrix.vscode-target }}
        run: |
          node scripts/run-integration-tests.mjs \
            "dist/mini-agent-$RELEASE_VERSION-$VSCODE_TARGET.vsix" \
            "$VSCODE_TARGET"

      - name: Upload native candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-${{ matrix.vscode-target }}
          path: |
            editors/vscode/dist/mini-agent-${{ env.RELEASE_VERSION }}-${{ matrix.vscode-target }}.vsix
            editors/vscode/dist/mini-agent-${{ env.RELEASE_VERSION }}-${{ matrix.vscode-target }}.cdx.json
          if-no-files-found: error
          retention-days: 1

  vscode-candidates:
    name: Assemble VSIX candidates
    needs: [package-metadata, vscode-vsix]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.package-metadata.outputs.version }}
    steps:
      - name: Download native candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vsix-*
          merge-multiple: true

      - name: Verify candidate set and checksums
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            test -f "mini-agent-$RELEASE_VERSION-$target.vsix"
            test -f "mini-agent-$RELEASE_VERSION-$target.cdx.json"
          done
          test "$(find . -maxdepth 1 -name '*.vsix' | wc -l)" -eq 5
          sha256sum *.vsix *.cdx.json | sort > VSIX_SHA256SUMS

      - name: Upload side-loadable candidate set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-candidates
          path: |
            *.vsix
            *.cdx.json
            VSIX_SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  windows-msi:
    name: Windows MSI
    needs: [build-windows, vscode-vsix]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows binary archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: archives-x86_64-pc-windows-msvc
          path: msi-input

      - name: Download Windows VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vsix-win32-x64
          path: msi-input

      - name: Validate MSI policy
        run: python3 scripts/check_windows_msi.py

      - name: Build MSI with pinned WiX
        shell: pwsh
        run: |
          tar.exe -xzf msi-input/mini-agent-x86_64-pc-windows-msvc.tar.gz -C msi-input
          $productVersion = ($env:GITHUB_REF_NAME.TrimStart('v') -split '-')[0]
          $binary = (Resolve-Path msi-input/mini-agent.exe).Path
          $vsixCandidates = @(Get-ChildItem msi-input/mini-agent-*-win32-x64.vsix)
          if ($vsixCandidates.Count -ne 1) {
            throw "Expected exactly one win32-x64 VSIX, found $($vsixCandidates.Count)"
          }
          $vsix = $vsixCandidates[0].FullName
          dotnet build packaging/windows/installer.wixproj `
            --configuration Release `
            --output msi-output `
            -p:ProductVersion=$productVersion `
            -p:BinaryPath=$binary `
            -p:VsixPath=$vsix
          if ($LASTEXITCODE -ne 0) { throw "WiX build failed with exit code $LASTEXITCODE" }

      - name: Quiet install, smoke, and uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path msi-output/mini-agent-windows-x64.msi).Path
          $installLog = Join-Path $env:RUNNER_TEMP mini-agent-msi-install.log
          $installResult = Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /quiet /norestart /l*v `"$installLog`"" `
            -Wait -PassThru
          if ($installResult.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog }
            throw "MSI install failed with exit code $($installResult.ExitCode)"
          }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\mini-agent\mini-agent.exe'
          if (-not (Test-Path $installed)) { throw "MSI did not install $installed" }
          $version = & $installed --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^mini-agent ') {
            throw "installed MSI binary failed its version smoke"
          }
          $uninstallResult = Start-Process msiexec.exe `
            -ArgumentList "/x `"$msi`" /quiet /norestart" `
            -Wait -PassThru
          if ($uninstallResult.ExitCode -ne 0) {
            throw "MSI uninstall failed with exit code $($uninstallResult.ExitCode)"
          }
          if (Test-Path $installed) { throw "MSI uninstall left the installed binary behind" }

      - name: Generate MSI checksum
        shell: pwsh
        run: |
          $msi = 'msi-output/mini-agent-windows-x64.msi'
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  mini-agent-windows-x64.msi" | Set-Content -Encoding ascii msi-output/MSI_SHA256SUMS

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: |
            msi-output/mini-agent-windows-x64.msi
            msi-output/MSI_SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub release
    needs: [package-metadata, build, build-static, build-windows, corresponding-source, checksums, vscode-candidates, windows-msi]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.package-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: archives-*
          merge-multiple: true

      - name: Download Corresponding Source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: corresponding-source

      - name: Download checksums
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checksums

      - name: Download VSIX candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vscode-candidates

      - name: Download Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer

      - name: Verify complete release set
        run: |
          expected=(
            mini-agent-x86_64-unknown-linux-gnu.tar.gz
            mini-agent-aarch64-unknown-linux-gnu.tar.gz
            mini-agent-x86_64-apple-darwin.tar.gz
            mini-agent-aarch64-apple-darwin.tar.gz
            mini-agent-x86_64-unknown-linux-musl.tar.gz
            mini-agent-aarch64-unknown-linux-musl.tar.gz
            mini-agent-x86_64-pc-windows-msvc.tar.gz
            mini-agent-lite-x86_64-unknown-linux-gnu.tar.gz
            mini-agent-lite-aarch64-unknown-linux-gnu.tar.gz
            mini-agent-lite-x86_64-apple-darwin.tar.gz
            mini-agent-lite-aarch64-apple-darwin.tar.gz
            mini-agent-lite-x86_64-unknown-linux-musl.tar.gz
            mini-agent-lite-aarch64-unknown-linux-musl.tar.gz
            mini-agent-lite-x86_64-pc-windows-msvc.tar.gz
            mini-agent-${GITHUB_REF_NAME}-source.tar.gz
            SHA256SUMS
            VSIX_SHA256SUMS
            MSI_SHA256SUMS
            mini-agent-windows-x64.msi
            mini-agent-${RELEASE_VERSION}-linux-x64.vsix
            mini-agent-${RELEASE_VERSION}-linux-arm64.vsix
            mini-agent-${RELEASE_VERSION}-darwin-x64.vsix
            mini-agent-${RELEASE_VERSION}-darwin-arm64.vsix
            mini-agent-${RELEASE_VERSION}-win32-x64.vsix
            mini-agent-${RELEASE_VERSION}-linux-x64.cdx.json
            mini-agent-${RELEASE_VERSION}-linux-arm64.cdx.json
            mini-agent-${RELEASE_VERSION}-darwin-x64.cdx.json
            mini-agent-${RELEASE_VERSION}-darwin-arm64.cdx.json
            mini-agent-${RELEASE_VERSION}-win32-x64.cdx.json
          )
          for f in "${expected[@]}"; do
            [ -f "$f" ] || { echo "ERROR: Missing expected file: $f"; exit 1; }
          done
          actual_count=$(ls *.tar.gz *.vsix *.cdx.json *.msi SHA256SUMS VSIX_SHA256SUMS MSI_SHA256SUMS 2>/dev/null | wc -l)
          if [ "$actual_count" -ne "${#expected[@]}" ]; then
            echo "ERROR: Unexpected files present (got $actual_count, expected ${#expected[@]})"
            ls *.tar.gz *.vsix *.cdx.json *.msi SHA256SUMS VSIX_SHA256SUMS MSI_SHA256SUMS
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          if [[ "$tag" == *-* ]]; then
            prerelease="--prerelease"
          fi
          version="${tag#v}"
          version="${version%%-*}"
          python3 scripts/extract-changelog.py \
            --version "$version" \
            --output release-notes.md
          # Remove any partial release from a prior failed attempt so reruns are clean
          gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$tag" \
            *.tar.gz *.vsix *.cdx.json *.msi SHA256SUMS VSIX_SHA256SUMS MSI_SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes-file release-notes.md \
            $prerelease

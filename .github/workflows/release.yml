name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CANONICAL_BINARY: mini-agent

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.96.0"

      - name: Validate Cargo and package metadata
        run: python3 scripts/check-package-metadata.py

  create-release:
    needs: package-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          # Any semver pre-release tag (contains a hyphen, e.g. v1.5.1-rc2)
          # is published as a GitHub prerelease, never as "latest".
          if [[ "$tag" == *-* ]]; then
            prerelease="--prerelease"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists, leaving it untouched"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes \
              $prerelease
          fi

  build:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.96.0"
          target: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --all-features --target ${{ matrix.target }}

      - name: Package and smoke binary
        run: |
          archive="${CANONICAL_BINARY}-${{ matrix.target }}.tar.gz"
          tar czf "$archive" -C "target/${{ matrix.target }}/release" "$CANONICAL_BINARY"
          test "$(tar tzf "$archive")" = "$CANONICAL_BINARY"
          smoke_dir="$(mktemp -d)"
          tar xzf "$archive" -C "$smoke_dir"
          "$smoke_dir/$CANONICAL_BINARY" --version | grep -Fq -- "$CANONICAL_BINARY "
          rm -rf "$smoke_dir"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${CANONICAL_BINARY}-${{ matrix.target }}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Build lite
        run: cargo build --release --no-default-features --target ${{ matrix.target }}

      - name: Package and smoke lite binary
        run: |
          archive="${CANONICAL_BINARY}-lite-${{ matrix.target }}.tar.gz"
          tar czf "$archive" -C "target/${{ matrix.target }}/release" "$CANONICAL_BINARY"
          test "$(tar tzf "$archive")" = "$CANONICAL_BINARY"
          smoke_dir="$(mktemp -d)"
          tar xzf "$archive" -C "$smoke_dir"
          "$smoke_dir/$CANONICAL_BINARY" --version | grep -Fq -- "$CANONICAL_BINARY "
          rm -rf "$smoke_dir"

      - name: Upload lite release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${CANONICAL_BINARY}-lite-${{ matrix.target }}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber

  build-static:
    name: ${{ matrix.target }}-static
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.96.0"

      - name: Install cross
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cross

      - name: Build static binary (${{ matrix.target }})
        run: cross build --release --all-features --target ${{ matrix.target }}

      - name: Package and smoke
        run: |
          archive="${CANONICAL_BINARY}-${{ matrix.target }}.tar.gz"
          tar czf "$archive" -C "target/${{ matrix.target }}/release" "$CANONICAL_BINARY"
          test "$(tar tzf "$archive")" = "$CANONICAL_BINARY"
          smoke_dir="$(mktemp -d)"
          tar xzf "$archive" -C "$smoke_dir"
          "$smoke_dir/$CANONICAL_BINARY" --version | grep -Fq -- "$CANONICAL_BINARY "
          rm -rf "$smoke_dir"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${CANONICAL_BINARY}-${{ matrix.target }}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Build static lite binary (${{ matrix.target }})
        run: cross build --release --no-default-features --target ${{ matrix.target }}

      - name: Package and smoke lite
        run: |
          archive="${CANONICAL_BINARY}-lite-${{ matrix.target }}.tar.gz"
          tar czf "$archive" -C "target/${{ matrix.target }}/release" "$CANONICAL_BINARY"
          test "$(tar tzf "$archive")" = "$CANONICAL_BINARY"
          smoke_dir="$(mktemp -d)"
          tar xzf "$archive" -C "$smoke_dir"
          "$smoke_dir/$CANONICAL_BINARY" --version | grep -Fq -- "$CANONICAL_BINARY "
          rm -rf "$smoke_dir"

      - name: Upload lite release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${CANONICAL_BINARY}-lite-${{ matrix.target }}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    name: SHA256SUMS
    needs: [build, build-static]
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          cd dist
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz'
          sha256sum *.tar.gz > SHA256SUMS
          gh release upload "$tag" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

name: Prepare guarded Git runtime
description: Provision native Git build prerequisites and prepare the pinned Windows payload before Cargo
inputs:
  target:
    description: Windows runtime target, x86_64-pc-windows-msvc (UCRT64) or aarch64-pc-windows-msvc (CLANGARM64, ARM64 host only)
    required: false
    default: x86_64-pc-windows-msvc
  collect-sources:
    description: Capture verified sources/notices for the actual redistributed DLL closure
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install Linux native Git build prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          build-essential patch pkg-config libcurl4-openssl-dev \
          zlib1g-dev libexpat1-dev libssl-dev

    - name: Capture the existing host HOME
      if: runner.os == 'Windows'
      id: home
      shell: pwsh
      run: |
        $present = Test-Path Env:HOME
        "present=$($present.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "value=$env:HOME" >> $env:GITHUB_OUTPUT

    - name: Month stamp bounding how long a prepared runtime may be reused
      if: runner.os == 'Windows' && inputs.collect-sources != 'true'
      id: month
      shell: pwsh
      run: '"value=$(Get-Date -AsUTC -Format yyyy-MM)" >> $env:GITHUB_OUTPUT'

    - name: Reuse the prepared Windows payload for unchanged pinned inputs
      # Release source collection needs the live signed package archives, so it never reuses a payload.
      # The key binds the pinned Git source, policy patch, build scripts and this action; the month
      # stamp refreshes the unpinned MSYS2 toolchain. build.rs still verifies every file hash.
      if: runner.os == 'Windows' && inputs.collect-sources != 'true'
      id: bundle-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/mini-agent-git-runtime-cache
        key: git-runtime-${{ inputs.target }}-${{ runner.arch }}-${{ steps.month.outputs.value }}-${{ hashFiles('scripts/git-runtime/policy.patch', 'scripts/git-runtime/git-2.56.0.tar.xz', 'scripts/build-git-runtime-windows.py', 'scripts/build-git-runtime.py', 'scripts/prepare-git-runtime.py', '.github/actions/prepare-git-runtime/action.yml') }}

    - name: Select the reused Windows payload
      if: runner.os == 'Windows' && steps.bundle-cache.outputs.cache-hit == 'true'
      shell: pwsh
      run: |
        $bundle = Join-Path $env:RUNNER_TEMP 'mini-agent-git-runtime-cache'
        if (-not (Test-Path (Join-Path $bundle 'bundle.manifest'))) { throw 'cached Git runtime lacks bundle.manifest' }
        "MINI_AGENT_GIT_RUNTIME_BUNDLE=$bundle" >> $env:GITHUB_ENV

    # The packages come from the official MSYS2 repositories only. setup-msys2 installs the base
    # system without touching the network for packages (no update, no install list); the retrying
    # synchronisation below replaces its single-attempt update.
    - name: Provision the UCRT64 MSYS2 base
      if: runner.os == 'Windows' && inputs.target != 'aarch64-pc-windows-msvc' && steps.bundle-cache.outputs.cache-hit != 'true'
      # Official v2 ref verified with git ls-remote; immutable publisher pin.
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
      with:
        msystem: UCRT64
        path-type: minimal
        update: false
        cache: false

    - name: Provision the CLANGARM64 MSYS2 base
      if: runner.os == 'Windows' && inputs.target == 'aarch64-pc-windows-msvc' && steps.bundle-cache.outputs.cache-hit != 'true'
      # Same publisher pin as the UCRT64 step; the clangarm64 repository is the
      # same signed MSYS2 package source, built natively on the ARM64 host.
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
      with:
        msystem: CLANGARM64
        path-type: minimal
        update: false
        cache: false

    - name: Limit pacman to the base and toolchain repositories
      if: runner.os == 'Windows' && steps.bundle-cache.outputs.cache-hit != 'true'
      shell: msys2 {0}
      env:
        MINI_AGENT_GIT_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        # Sync only the base repository and the one the toolchain comes from; the other
        # environments' databases are never downloaded.
        if [ "$MINI_AGENT_GIT_TARGET" = aarch64-pc-windows-msvc ]; then keep=clangarm64; else keep=ucrt64; fi
        /usr/bin/awk -v keep="$keep" '
          /^\[.*\]$/ { name = substr($0, 2, length($0) - 2); skip = (name != "options" && name != "msys" && name != keep) }
          !skip { print }' /etc/pacman.conf > /tmp/pacman.conf.new
        grep -Fxq "[$keep]" /tmp/pacman.conf.new
        cp /tmp/pacman.conf.new /etc/pacman.conf

    - name: Upgrade the MSYS2 core (pass 1; MSYS2 ends its own processes)
      if: runner.os == 'Windows' && steps.bundle-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        # A core (msys-runtime) update terminates every MSYS2 process, including its shell, so it is
        # run from a non-MSYS2 process and its exit status is not meaningful. Pass 2 repeats the full
        # upgrade strictly, with retries, and fails the job if the system is not fully synchronised.
        $script = Join-Path $env:RUNNER_TEMP 'mini-agent-pacman-core.sh'
        Set-Content -Path $script -Value '/usr/bin/pacman --noconfirm -Syuu' -Encoding ascii
        & (Join-Path $env:RUNNER_TEMP 'setup-msys2\msys2.cmd') $script
        $global:LASTEXITCODE = 0
        exit 0

    - name: Install the explicit build dependencies (pass 2, retrying)
      if: runner.os == 'Windows' && steps.bundle-cache.outputs.cache-hit != 'true'
      shell: msys2 {0}
      env:
        MINI_AGENT_GIT_TARGET: ${{ inputs.target }}
      run: |
        set -uo pipefail
        # The strict full upgrade after the core pass; retries cover slow mirrors (pacman skips a failing mirror).
        if [ "$MINI_AGENT_GIT_TARGET" = aarch64-pc-windows-msvc ]; then
          packages="make patch python zstd diffutils mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-curl-winssl mingw-w64-clang-aarch64-pcre2 mingw-w64-clang-aarch64-zlib mingw-w64-clang-aarch64-expat mingw-w64-clang-aarch64-libiconv"
        else
          packages="make patch python zstd diffutils mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-curl-winssl mingw-w64-ucrt-x86_64-pcre2 mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-expat mingw-w64-ucrt-x86_64-libiconv"
        fi
        for attempt in 1 2 3; do
          /usr/bin/pacman --noconfirm -Syuu && /usr/bin/pacman --noconfirm --needed -S $packages && exit 0
          echo "::warning::pacman install attempt $attempt failed"
          sleep $((attempt * 20))
        done
        exit 1

    - name: Build and select the pinned Windows payload
      if: runner.os == 'Windows' && steps.bundle-cache.outputs.cache-hit != 'true'
      shell: msys2 {0}
      env:
        MINI_AGENT_BUILD_HOST_HOME: ${{ steps.home.outputs.value }}
        MINI_AGENT_BUILD_HOME_PRESENT: ${{ steps.home.outputs.present }}
        MINI_AGENT_GIT_COLLECT_SOURCES: ${{ inputs.collect-sources }}
        MINI_AGENT_GIT_TARGET: ${{ inputs.target }}
        MINI_AGENT_GIT_REUSE_DIRECTORY: ${{ runner.temp }}/mini-agent-git-runtime-cache
      run: |
        set -euo pipefail
        if [ "$MINI_AGENT_BUILD_HOME_PRESENT" = true ]; then
          export HOME="$MINI_AGENT_BUILD_HOST_HOME"
        else
          unset HOME
        fi
        temp_root=$(/usr/bin/cygpath -u "$RUNNER_TEMP")
        owned=$(/usr/bin/mktemp -d "$temp_root/mini-agent-git-runtime-XXXXXX")
        /usr/bin/python3 scripts/build-git-runtime-windows.py \
          --target "$MINI_AGENT_GIT_TARGET" --output "$owned/bundle"
        test -s "$owned/bundle/bundle.manifest"
        bundle=$(/usr/bin/cygpath -am "$owned/bundle")
        if [ "$MINI_AGENT_GIT_COLLECT_SOURCES" != true ]; then
          # Publish the verified payload where the cache step saves it after the job.
          reuse=$(/usr/bin/cygpath -u "$MINI_AGENT_GIT_REUSE_DIRECTORY")
          /usr/bin/mkdir -p "$reuse"
          /usr/bin/cp -a "$owned/bundle/." "$reuse/"
          test -s "$reuse/bundle.manifest"
          bundle=$(/usr/bin/cygpath -am "$reuse")
        fi
        github_env=$(/usr/bin/cygpath -u "$GITHUB_ENV")
        printf 'MINI_AGENT_GIT_RUNTIME_BUNDLE=%s\n' "$bundle" >> "$github_env"
        # This signed-package inventory is build provenance, not runtime approval.
        /usr/bin/pacman -Q > "$owned/toolchain-packages.txt"
        if [ "$MINI_AGENT_GIT_COLLECT_SOURCES" = true ]; then
          /usr/bin/python3 scripts/collect-git-native-sources.py \
            --distro msys2 --target "$MINI_AGENT_GIT_TARGET" \
            --bundle "$owned/bundle" --output "$owned/native-sources"
          test -s "$owned/native-sources/native-components.json"
          source_root=$(/usr/bin/cygpath -am "$owned/native-sources")
          printf 'MINI_AGENT_GIT_NATIVE_SOURCE_ROOT=%s\n' "$source_root" >> "$github_env"
          printf 'MINI_AGENT_GIT_NATIVE_RECORD=%s/native-components.json\n' "$source_root" >> "$github_env"
        fi
